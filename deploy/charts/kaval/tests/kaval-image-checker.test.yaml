# promtool unit tests for kaval-image-checker.rules.yaml (KAV-140). `make rules-test` runs them.
# The quiet cases are the point: a checker that is up and sees only signed or frozen images must
# never send anyone a message.
rule_files:
  - ../files/kaval-image-checker.rules.yaml
evaluation_interval: 30s

tests:
  - name: checker up and only passes is quiet
    interval: 30s
    input_series:
      - series: 'up{job="kyverno"}'
        values: "1x60"
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="pass"}'
        values: "0+1x60"
    alert_rule_test:
      - { eval_time: 30m, alertname: ImageCheckerDown, exp_alerts: [] }
      - { eval_time: 30m, alertname: UnsignedImageSeen, exp_alerts: [] }

  - name: a checker that vanishes is reported after five minutes, not before
    interval: 30s
    input_series:
      - series: 'up{job="kyverno"}'
        values: "1x20 _x60"
    alert_rule_test:
      - { eval_time: 12m, alertname: ImageCheckerDown, exp_alerts: [] }
      - eval_time: 25m
        alertname: ImageCheckerDown
        exp_alerts:
          - exp_labels: { severity: critical, kaval_health: "true" }
            exp_annotations: { summary: The cluster's image checker (Kyverno) cannot be reached. }

  - name: a checker that answers 0 is reported too
    interval: 30s
    input_series:
      - series: 'up{job="kyverno"}'
        values: "1x10 0x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: ImageCheckerDown
        exp_alerts:
          - exp_labels: { severity: critical, kaval_health: "true" }
            exp_annotations: { summary: The cluster's image checker (Kyverno) cannot be reached. }

  - name: the first ever failure fires (the counter appears at 1)
    interval: 30s
    input_series:
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail"}'
        values: "_x20 1x60"
    alert_rule_test:
      - eval_time: 12m
        alertname: UnsignedImageSeen
        exp_alerts:
          - exp_labels: { severity: warning, kaval_health: "true" }
            exp_annotations: { summary: "A Kaval image has no valid signature and is not on the frozen list (runbook image-flagged-by-the-cluster-check)." }

  - name: a later failure on an existing counter fires, and goes quiet again
    interval: 30s
    input_series:
      # one old failure for 40 minutes, then a second one, then nothing new
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail"}'
        values: "1x80 2x120"
    alert_rule_test:
      - { eval_time: 30m, alertname: UnsignedImageSeen, exp_alerts: [] }
      - eval_time: 45m
        alertname: UnsignedImageSeen
        exp_alerts:
          - exp_labels: { severity: warning, kaval_health: "true" }
            exp_annotations: { summary: "A Kaval image has no valid signature and is not on the frozen list (runbook image-flagged-by-the-cluster-check)." }
      - { eval_time: 80m, alertname: UnsignedImageSeen, exp_alerts: [] }

  - name: some other policy failing does not count
    interval: 30s
    input_series:
      - series: 'kyverno_image_validating_policy_results_total{policy_name="something-else",result="fail"}'
        values: "_x20 1x60"
      # even from a checker that has just restarted (KAV-144)
      - series: 'process_start_time_seconds{job="kyverno",instance="c:8000"}'
        values: "0x120"
    alert_rule_test:
      - { eval_time: 12m, alertname: UnsignedImageSeen, exp_alerts: [] }

  # ── KAV-144: a refusal right after a checker restart ─────────────────────────────────────────
  # Found live on staging (KAV-142): the checker restarts in place (same pod, same address), its
  # counter starts again at 0, and a refusal before the first scrape makes it read 1. Prometheus
  # sees 1 before the restart and 1 after: no increase, no reset, no new series. Only the
  # checker's own start time (process_start_time_seconds, which Kyverno 1.20 publishes) moved.
  - name: a refusal right after a checker restart fires
    interval: 30s
    input_series:
      # an old refusal at 5 minutes; the checker restarts at 60 minutes and refuses again at once
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail",job="kyverno",instance="c:8000"}'
        values: "_x10 1x230"
      - series: 'process_start_time_seconds{job="kyverno",instance="c:8000"}'
        values: "0x120 3600x120"
    alert_rule_test:
      - { eval_time: 50m, alertname: UnsignedImageSeen, exp_alerts: [] }
      - eval_time: 70m
        alertname: UnsignedImageSeen
        exp_alerts:
          - exp_labels: { severity: warning, kaval_health: "true" }
            exp_annotations: { summary: "A Kaval image has no valid signature and is not on the frozen list (runbook image-flagged-by-the-cluster-check)." }
      # quiet again 15 minutes after the restart, like every other branch of this alert
      - { eval_time: 80m, alertname: UnsignedImageSeen, exp_alerts: [] }

  - name: a restart with no new refusal is quiet (the old count is gone)
    interval: 30s
    input_series:
      # an old refusal, then a restart; the new checker has refused nothing, so it shows no series.
      # Prometheus marks a series that leaves a scrape as stale at once (`stale` here); without
      # the marker the old 1 would linger for five minutes, which real Prometheus does not do.
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail",job="kyverno",instance="c:8000"}'
        values: "_x10 1x109 stale _x119"
      - series: 'process_start_time_seconds{job="kyverno",instance="c:8000"}'
        values: "0x120 3600x120"
    alert_rule_test:
      - { eval_time: 62m, alertname: UnsignedImageSeen, exp_alerts: [] }
      - { eval_time: 70m, alertname: UnsignedImageSeen, exp_alerts: [] }

  - name: a restart whose counter comes back at 0 is quiet
    interval: 30s
    input_series:
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail",job="kyverno",instance="c:8000"}'
        values: "_x10 1x110 0x120"
      - series: 'process_start_time_seconds{job="kyverno",instance="c:8000"}'
        values: "0x120 3600x120"
    alert_rule_test:
      - { eval_time: 70m, alertname: UnsignedImageSeen, exp_alerts: [] }

  - name: an old refusal on a checker that has run for a long time stays quiet
    interval: 30s
    input_series:
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail",job="kyverno",instance="c:8000"}'
        values: "_x10 1x230"
      - series: 'process_start_time_seconds{job="kyverno",instance="c:8000"}'
        values: "0x240"
    alert_rule_test:
      - { eval_time: 70m, alertname: UnsignedImageSeen, exp_alerts: [] }
      - { eval_time: 110m, alertname: UnsignedImageSeen, exp_alerts: [] }

  - name: a refusal from a replaced checker pod (a new address) fires too
    interval: 30s
    input_series:
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail",job="kyverno",instance="old:8000"}'
        values: "_x10 1x110"
      - series: 'kyverno_image_validating_policy_results_total{policy_name="kaval-images-signed",result="fail",job="kyverno",instance="new:8000"}'
        values: "_x120 1x120"
    alert_rule_test:
      - eval_time: 65m
        alertname: UnsignedImageSeen
        exp_alerts:
          - exp_labels: { severity: warning, kaval_health: "true" }
            exp_annotations: { summary: "A Kaval image has no valid signature and is not on the frozen list (runbook image-flagged-by-the-cluster-check)." }

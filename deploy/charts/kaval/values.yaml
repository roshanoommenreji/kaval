# Chart defaults. An environment's own values.yaml (deploy/environments/<env>/values.yaml)
# overrides only what that environment needs — CLAUDE.md: "a template change needed for one
# environment and not another is a defect, not a special case."

nameOverride: ""

global:
  # Prefixed onto every service's image.repository when set (see _helpers.tpl's
  # "kaval.image"). Empty for local/k3d, where the bare repository name already resolves.
  # Prod's Flux HelmRelease injects the real ECR registry here via valuesFrom/targetPath —
  # never committed, since that hostname embeds the AWS account ID (KAV-51).
  imageRegistry: ""
  # Name of a pre-existing docker-registry Secret, in this release's own namespace, to
  # pull with. Empty for local/k3d (above). Prod's Flux HelmRelease sets it to "ecr-cred" —
  # a Secret the node's cloud-init keeps refreshed from the node's own IAM role, since ECR
  # login tokens expire every 12h and this node has no EKS-style credential provider
  # (KAV-51; that lands with IRSA in Phase 6/7, per ADR-0024's IAM scoping decision).
  imagePullSecretName: ""

postgres:
  # true = this chart runs its own in-cluster Postgres (today's local/dev/CI behaviour).
  # An environment with its own database server (ADR-0008, KAV-32) sets this false and
  # fills in secretNames below instead — postgres.yaml renders nothing at all in that case.
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 2Gi
  storageClassName: ""   # "" = the cluster's default StorageClass
  database: kaval
  username: kaval
  # No default password. Every environment's own values.yaml sets postgres.password
  # explicitly (local: a plain dev value, matching .env.example) when postgres.enabled
  # is true. Ignored when it's false.
  password: ""
  # Per-service Secret names (KAV-32, ADR-0008). Empty string (the default, every key) means
  # "use this chart's own postgres.yaml Secret" — local/dev/CI, unaffected by any of this. An
  # environment with its own database server sets every key to a real Secret created out of
  # band (same posture as global.imagePullSecretName/ecr-cred and gateway.slackSecretName —
  # never a password committed here), each carrying its own Postgres role's credentials.
  secretNames:
    gateway: ""
    agent: ""
    executor: ""
    collector: ""
    migrate: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

backup:
  # Nightly pg_dump -> S3 (scripts/ops/backup.sh, ADR-0005/ADR-0008). Off by default: local/
  # dev/CI have no S3 bucket to dump into. Also runs the one-time per-service Postgres role
  # grants (scripts/ops/db-roles.sql) as a post-install/post-upgrade hook when enabled.
  enabled: false
  image:
    repository: kaval/backup
    tag: dev
    pullPolicy: IfNotPresent
  bucketName: ""
  schedule: "0 0 * * *" # 00:00 UTC — before the DLM snapshot at 03:00 UTC (infra/modules/database)
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

gateway:
  image:
    repository: kaval/gateway
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  # Reached by the gateway's own /healthz check (kaval_gateway/main.py's check_ollama()).
  # Empty by default: no environment's chart deploys Ollama yet (ADR-0016's deployed-agent
  # trigger design is still unresolved, and diagnose.py/escalate.py stay laptop-run tools) —
  # see Lab 15 for what that means for this check in a local k3d deployment.
  ollamaBaseUrl: ""
  localModel: ""
  logLevel: INFO
  # Slack ChatOps (KAV-55, ADR-0026). Empty by default: the gateway behaves exactly as it
  # does today (no Slack connection, scripts/ops/approve.py is the approval flow) unless an
  # environment sets this. Only the Secret's *name* lives here — never a token — and that
  # Secret is created out of band (same posture as global.imagePullSecretName/ecr-cred, not
  # something this chart generates), with SLACK_BOT_TOKEN, SLACK_APP_TOKEN and
  # SLACK_CHANNEL_ID as its keys.
  slackSecretName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

agent:
  image:
    repository: kaval/agent
    tag: dev
    pullPolicy: IfNotPresent
  # Seconds between correlation passes (kaval_agent.correlate's own --every flag). Short
  # locally so a demo doesn't sit waiting; a real environment would widen this.
  correlateEverySeconds: 30
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

executor:
  image:
    repository: kaval/executor
    tag: dev
    pullPolicy: IfNotPresent
  # Seconds between execution passes (kaval_executor.executor's own --every flag).
  executeEverySeconds: 15
  # The namespace the executor's Role/RoleBinding are granted in — deliberately NOT this
  # release's own namespace (CLAUDE.md constraint 3, KAV-47: see deploy/charts/kaval/
  # templates/executor.yaml's header comment for why that split is the point). This is
  # where a demo workload for the executor to act on lives, e.g. `kubectl create deployment
  # checkout --image=nginx:alpine -n kaval-demo` — the chart creates the namespace, not a
  # workload in it; chaos (Phase 5) is what will later populate it on purpose.
  demoNamespace: kaval-demo
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

collector:
  image:
    repository: kaval/collector
    tag: dev
    pullPolicy: IfNotPresent
  # Seconds between event polls (kaval_collector.k8s_events' own --every flag). Short
  # locally, same reasoning as agent.correlateEverySeconds and executor.executeEverySeconds.
  watchEverySeconds: 15
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

# Prometheus, and the collector poller that turns it into signals (KAV-75, ADR-0040).
# Off here; an environment switches it on from its own values file. The memory limit below is
# a first guess until Lab 43 measures it, and staging/prod stay off until it is measured on a
# real node (docs/architecture/overview.md carries the 4 GB budget).
prometheus:
  enabled: false
  # quay.io, not Docker Hub: no anonymous pull limit on a node that restarts. Pinned by digest.
  image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
  scrapeIntervalSeconds: 30
  # How long measurements are kept. Short on purpose: the signal table is the record, and
  # retention is what Prometheus's memory scales with.
  retention: 2h
  # The kubelet's serving certificate is not signed for the address Prometheus finds it at on
  # every distribution. The traffic stays inside the cluster and the token it sends can only
  # read node metrics (the ClusterRole above). ADR-0040 records this as a stated shortcut.
  kubeletInsecureSkipVerify: true
  # kaval_collector.prometheus's own flags.
  pollEverySeconds: 30
  memoryNearLimitThreshold: 0.9
  # While a container stays near its limit, write a fresh signal this often so its incident
  # stays open (the 15-minute quiet window in kaval_agent.correlate).
  renewSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

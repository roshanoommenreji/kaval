# Chart defaults. An environment's own values.yaml (deploy/environments/<env>/values.yaml)
# overrides only what that environment needs — CLAUDE.md: "a template change needed for one
# environment and not another is a defect, not a special case."

nameOverride: ""

global:
  # Prefixed onto every service's image.repository when set (see _helpers.tpl's
  # "kaval.image"). Empty for local/k3d, where the bare repository name already resolves.
  # Prod's Flux HelmRelease injects the real ECR registry here via valuesFrom/targetPath —
  # never committed, since that hostname embeds the AWS account ID (KAV-51).
  imageRegistry: ""
  # Name of a pre-existing docker-registry Secret, in this release's own namespace, to
  # pull with. Empty for local/k3d (above). Prod's Flux HelmRelease sets it to "ecr-cred" —
  # a Secret the node's cloud-init keeps refreshed from the node's own IAM role, since ECR
  # login tokens expire every 12h and this node has no EKS-style credential provider
  # (KAV-51; that lands with IRSA in Phase 6/7, per ADR-0024's IAM scoping decision).
  imagePullSecretName: ""

postgres:
  # true = this chart runs its own in-cluster Postgres (today's local/dev/CI behaviour).
  # An environment with its own database server (ADR-0008, KAV-32) sets this false and
  # fills in secretNames below instead — postgres.yaml renders nothing at all in that case.
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 2Gi
  storageClassName: ""   # "" = the cluster's default StorageClass
  database: kaval
  username: kaval
  # No default password. Every environment's own values.yaml sets postgres.password
  # explicitly (local: a plain dev value, matching .env.example) when postgres.enabled
  # is true. Ignored when it's false.
  password: ""
  # Per-service Secret names (KAV-32, ADR-0008). Empty string (the default, every key) means
  # "use this chart's own postgres.yaml Secret" — local/dev/CI, unaffected by any of this. An
  # environment with its own database server sets every key to a real Secret created out of
  # band (same posture as global.imagePullSecretName/ecr-cred and gateway.slackSecretName —
  # never a password committed here), each carrying its own Postgres role's credentials.
  secretNames:
    gateway: ""
    agent: ""
    executor: ""
    collector: ""
    migrate: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

backup:
  # Nightly pg_dump -> S3 (scripts/ops/backup.sh, ADR-0005/ADR-0008). Off by default: local/
  # dev/CI have no S3 bucket to dump into. Also runs the one-time per-service Postgres role
  # grants (scripts/ops/db-roles.sql) as a post-install/post-upgrade hook when enabled.
  enabled: false
  image:
    repository: kaval/backup
    tag: dev
    pullPolicy: IfNotPresent
  bucketName: ""
  schedule: "0 0 * * *" # 00:00 UTC — before the DLM snapshot at 03:00 UTC (infra/modules/database)
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

gateway:
  image:
    repository: kaval/gateway
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8000
  # Reached by the gateway's own /healthz check (kaval_gateway/main.py's check_ollama()).
  # Empty by default: the gateway does not use the model, and is not pointed at the in-cluster
  # one that the diagnosis worker uses (`ollama:` below, KAV-87) — so /healthz reports it as
  # unreachable. See Lab 15 for what that means for this check in a local k3d deployment.
  ollamaBaseUrl: ""
  localModel: ""
  logLevel: INFO
  # Slack ChatOps (KAV-55, ADR-0026). Empty by default: the gateway behaves exactly as it
  # does today (no Slack connection, scripts/ops/approve.py is the approval flow) unless an
  # environment sets this. Only the Secret's *name* lives here — never a token — and that
  # Secret is created out of band (same posture as global.imagePullSecretName/ecr-cred, not
  # something this chart generates), with SLACK_BOT_TOKEN, SLACK_APP_TOKEN and
  # SLACK_CHANNEL_ID as its keys.
  #
  # The same Secret may also carry SLACK_ESCALATION_CHANNEL_ID (KAV-82): a second channel for
  # the louder "nobody answered" message. Optional; without it the message goes to the first
  # channel with an @here.
  slackSecretName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

# Approvals that nobody answers (KAV-82, ADR-0048). A proposal waiting on a person gets a
# reminder, then a louder second message, then expires: a request this old is no longer trusted
# and a late click is refused. Minutes since the proposal was filed; must satisfy
# 0 < reminder < escalate < expire or the gateway uses 15 / 30 / 240. The executor also refuses
# to act on an approval older than executorMaxAgeMinutes (production is parked most nights, so an
# approval can outlive the moment it was given for).
approvals:
  reminderMinutes: 15
  escalateMinutes: 30
  expireMinutes: 240
  executorMaxAgeMinutes: 60

agent:
  image:
    repository: kaval/agent
    tag: dev
    pullPolicy: IfNotPresent
  # Seconds between correlation passes (kaval_agent.correlate's own --every flag). Short
  # locally so a demo doesn't sit waiting; a real environment would widen this.
  correlateEverySeconds: 30
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

executor:
  image:
    repository: kaval/executor
    tag: dev
    pullPolicy: IfNotPresent
  # Seconds between execution passes (kaval_executor.executor's own --every flag).
  executeEverySeconds: 15
  # The namespace the executor's Role/RoleBinding are granted in — deliberately NOT this
  # release's own namespace (CLAUDE.md constraint 3, KAV-47: see deploy/charts/kaval/
  # templates/executor.yaml's header comment for why that split is the point). This is
  # where a demo workload for the executor to act on lives, e.g. `kubectl create deployment
  # checkout --image=nginx:alpine -n kaval-demo` — the chart creates the namespace, not a
  # workload in it; chaos (Phase 5) is what will later populate it on purpose.
  demoNamespace: kaval-demo
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

collector:
  image:
    repository: kaval/collector
    tag: dev
    pullPolicy: IfNotPresent
  # Seconds between event polls (kaval_collector.k8s_events' own --every flag). Short
  # locally, same reasoning as agent.correlateEverySeconds and executor.executeEverySeconds.
  watchEverySeconds: 15
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

# The language model, run in the cluster (KAV-87, ADR-0055). Off here; an environment switches it
# on from its own values file, staging first. It shares the 4 GB app node with everything else, so
# the model is unloaded after `keepAlive` idle and the container has a memory limit: if it ever
# grows, the kernel stops the model, not a neighbour. The files live in an emptyDir, so a new pod
# downloads them again (about a minute); the init step refuses a model whose id is not the pinned
# one, so a model changed upstream cannot get in unnoticed. Nothing is exposed outside the cluster.
ollama:
  enabled: false
  # Docker Hub; pinned by digest (the multi-architecture index of 0.34.4, checked 2026-10-14).
  image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
  model: gemma3:1b-it-qat
  # The id `ollama list` shows for it (the first 12 characters of its content hash).
  modelId: b491bd3989c6
  embedModel: all-minilm
  embedModelId: 1b226e2802db
  keepAlive: 5m
  contextLength: 4096
  storageLimit: 4Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1500m, memory: 1536Mi }

# The diagnosis worker (KAV-87, ADR-0055): asks the model about each new incident and files the
# proposal, with nobody running a command. It is the agent image with a different command. It
# needs `ollama.enabled`. No ServiceAccount token: it reads and writes the database and nothing else.
diagnoser:
  enabled: false
  everySeconds: 30
  # The speed limit: proposals an hour, and how old an incident may be and still be diagnosed.
  maxPerHour: 6
  maxAgeHours: 4
  # One model call may take this long (the cluster's two vCPUs are slower than a laptop).
  timeoutSeconds: 90
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 250m, memory: 256Mi }

# The cost reader's cluster half (KAV-92, ADR-0060): reads the AWS bill the server's daily cost pull
# leaves in one ConfigMap and writes cost signals. Off here; an environment switches it on from its
# own values file. It needs `prometheus.enabled` (its alarm is a Prometheus rule). The pull itself is
# on the server (infra/modules/node), not here: nothing in the cluster holds an AWS login.
costReader:
  enabled: false
  # How often the ConfigMap is looked at. The pull is daily; this only decides how soon a new day's
  # rows or a failure show up on the health page.
  everySeconds: 300
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 100m, memory: 128Mi }
  # The same pod also reads the daily waste scan the server leaves in a second ConfigMap (KAV-94,
  # ADR-0062) and writes a signal per finding. Off until the collector image that has the reading code
  # is the one pinned, because an older image would not start with the extra argument. The scan's
  # alarms are loaded only with it.
  wasteScan:
    enabled: false

# Safe removal of waste (KAV-95, ADR-0063): the planner files two-step proposals for a disk attached
# to nothing and for an old backup copy, the executor hands an approved step over as an order, and the
# removal worker (outside the cluster, infra/modules/waste-removal) does the deleting. This is the one
# switch for the cluster's side. It needs the cost reader and the waste scan read, because the worker's
# answers come back through the same pod. Off everywhere until a build containing it is pinned.
removal:
  enabled: false
  # Hours between marking a disk and the delete step. MUST equal the worker's `grace_hours`
  # (Terraform): the worker re-checks it and refuses early, which would show as a failed removal.
  graceHours: 168

# Prometheus, and the collector poller that turns it into signals (KAV-75, ADR-0040).
# Off here; an environment switches it on from its own values file. The memory limit below is
# a first guess until Lab 43 measures it, and staging/prod stay off until it is measured on a
# real node (docs/architecture/overview.md carries the 4 GB budget).
prometheus:
  enabled: false
  # quay.io, not Docker Hub: no anonymous pull limit on a node that restarts. Pinned by digest.
  image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
  scrapeIntervalSeconds: 30
  # How long measurements are kept. Short on purpose: the signal table is the record, and
  # retention is what Prometheus's memory scales with.
  retention: 2h
  # Verify the kubelet's certificate against the cluster CA (proven on k3d, Lab 43). Flip to
  # true in one environment's values only if its kubelet's certificate does not cover the
  # address Prometheus finds it at; the token sent can only read node metrics either way.
  kubeletInsecureSkipVerify: false
  # kaval_collector.prometheus's own flags.
  pollEverySeconds: 30
  memoryNearLimitThreshold: 0.9
  # While a container stays near its limit, write a fresh signal this often so its incident
  # stays open (the 15-minute quiet window in kaval_agent.correlate).
  renewSeconds: 300
  # Disk (KAV-81, ADR-0047). The query returns the used fraction (0 to 1) of the node's root disk:
  # cAdvisor reports its used and total bytes, and the filter keeps real block devices over 1 GB
  # (not /dev/shm, /run or the small boot partition). Empty turns the check off.
  disk:
    query: >-
      (container_fs_usage_bytes{id="/",device=~"/dev/(nvme|xvd|sd|vd).*"}
      / container_fs_limit_bytes{id="/",device=~"/dev/(nvme|xvd|sd|vd).*"})
      and (container_fs_limit_bytes{id="/"} > 1e9)
    # A person is told above this fraction. Staging sets it lower on purpose so a bounded test fill
    # can cross it (docs/adr/0047); prod keeps this one.
    threshold: 0.85
  # The database server's own numbers (KAV-82, ADR-0050): two small exporters on that server
  # (machine and Postgres), scraped from here. Off by default; an environment turns it on once its
  # database server runs the exporters. Prod gets it with Prometheus itself (KAV-83).
  database:
    enabled: false
    # The used fraction (0 to 1) of the database server's real disks (root and data volume). The
    # exporter runs in a container, so it also lists the container's own /etc/hosts and
    # /etc/hostname (the same root disk again); they are left out so an alert names a real mount.
    diskQuery: >-
      max by (mountpoint) (1 - node_filesystem_avail_bytes{job="database-node",fstype=~"ext4|xfs",mountpoint!~"/etc/.*"}
      / node_filesystem_size_bytes{job="database-node",fstype=~"ext4|xfs",mountpoint!~"/etc/.*"})
    diskThreshold: 0.85
  # Slowness (KAV-81): services to time with one small request each pass, as
  # namespace/name=url,... Empty probes nothing. A request slower than slowSeconds, or none in time,
  # three passes in a row, is a slow service.
  probe:
    targets: ""
    slowSeconds: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Chaos experiments (KAV-79, ADR-0044). OFF everywhere unless an environment's own values file
# turns it on: staging and local do, prod never does, and nothing below is rendered when it is
# false (a test renders prod and fails if any chaos object appears). The runner is the BREAKER,
# its own identity with a grant only in the demo namespace; it is not the executor.
chaos:
  enabled: false
  # What this environment calls itself to the runner, which refuses anything but local/staging.
  environment: ""
  # The Job is killed after this long whatever the code is doing. The switch ConfigMap is
  # rendered "false" on every deploy, so a deploy always leaves chaos off; a game day turns it on
  # with `make chaos-run` and back off at the end.
  hardLimitSeconds: 1500
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 192Mi }

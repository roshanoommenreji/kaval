# Runs `alembic upgrade head` from the gateway image before every install/upgrade — the same
# image, the same command, compose.yaml's `migrate` one-shot service runs locally. A Helm hook
# rather than an initContainer on the gateway Deployment: migrations run exactly once per
# release, not once per gateway pod, and the hook's own wait-for-postgres initContainer keeps
# this independent of whatever the postgres Deployment's readiness timing happens to be.
#
# post-install, not pre-install: a pre-install hook runs *before any other resource in the
# release exists at all* — including the postgres Deployment this job's initContainer waits
# for, which would otherwise wait forever on a fresh install. Found live, not guessed: the
# first real `helm install` left this job stuck at Init:0/1 with no postgres pod anywhere in
# `kubectl get pods` to wait for (Lab 15). pre-upgrade is still correct for upgrades, where
# postgres already exists from the previous release.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kaval.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kaval.selectorLabels" (dict "Release" .Release "component" "migrate") | nindent 8 }}
    spec:
      {{- include "kaval.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          envFrom:
            - secretRef:
                name: {{ include "kaval.postgresSecretName" (dict "root" $ "service" "migrate") }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT"; do
                echo "waiting for postgres..."; sleep 2
              done
      containers:
        - name: migrate
          image: "{{ include "kaval.image" (dict "root" $ "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ include "kaval.postgresSecretName" (dict "root" $ "service" "migrate") }}

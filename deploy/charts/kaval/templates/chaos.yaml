{{- if .Values.chaos.enabled }}
# Chaos runner (KAV-79, ADR-0044; second experiment KAV-80, ADR-0045). Everything here exists only where `chaos.enabled` is true
# (staging and local). The runner BREAKS something on purpose; the executor FIXES it. They are
# different ServiceAccounts with different grants, so the one that can create the damage cannot
# repair it and the one that repairs cannot create it.
#
# - The runner's ServiceAccount lives in this release's namespace (where the image-pull Secret
#   is) but its only write grant is in the DEMO namespace, bound with a RoleBinding, never a
#   ClusterRoleBinding: it can create and delete Deployments there and read pods, nothing else,
#   and nothing at all in Kaval's own namespace except reading the one switch ConfigMap by name.
# - It has no database credentials and cannot reach the policy engine.
# - The CronJob is suspended and never fires by itself. A person starts it
#   (`kubectl create job --from=cronjob/...`, wrapped by `make chaos-run`), and the Job is killed
#   after `chaos.hardLimitSeconds` whatever the code is doing.
# - `kubectl auth can-i create deployments -n {{ .Release.Namespace }} --as=system:serviceaccount:{{ .Release.Namespace }}:{{ include "kaval.fullname" . }}-chaos-runner`
#   must say "no" (Lab 46); that command, not this comment, is the proof.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaval.fullname" . }}-chaos-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaval.fullname" . }}-chaos-switch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
data:
  enabled: "false"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaval.fullname" . }}-chaos-switch-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "kaval.fullname" . }}-chaos-switch"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaval.fullname" . }}-chaos-switch-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaval.fullname" . }}-chaos-switch-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kaval.fullname" . }}-chaos-runner
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaval.fullname" . }}-chaos-runner
  namespace: {{ .Values.executor.demoNamespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "delete"]
  # KAV-80: the bad-release experiment ships its second version to ITS victim, which is a patch.
  # `resourceNames` limits that one write verb to that one Deployment; the executor, which repairs,
  # can patch any Deployment in this namespace, and the runner still cannot touch anything else.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["chaos-badrelease"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # KAV-81: the slow-service experiment gives its program an address. A Service cannot be
  # limited to one name on create, so create is the namespace's; get and delete are by name.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["chaos-slowpoke"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaval.fullname" . }}-chaos-runner
  namespace: {{ .Values.executor.demoNamespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaval.fullname" . }}-chaos-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "kaval.fullname" . }}-chaos-runner
    namespace: {{ .Release.Namespace }}
{{- range $experiment := list "oom" "badrelease" "slow" "disk" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kaval.fullname" $ }}-chaos-{{ $experiment }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kaval.labels" $ | nindent 4 }}
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $.Values.chaos.hardLimitSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kaval-chaos-{{ $experiment }}
        spec:
          {{- include "kaval.imagePullSecrets" $ | nindent 10 }}
          serviceAccountName: {{ include "kaval.fullname" $ }}-chaos-runner
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: chaos
              image: "{{ include "kaval.image" (dict "root" $ "repository" $.Values.executor.image.repository "tag" $.Values.executor.image.tag) }}"
              imagePullPolicy: {{ $.Values.executor.image.pullPolicy }}
              command: ["python", "-m", "kaval_executor.chaos", "{{ $experiment }}"]
              env:
                - name: CHAOS_ENVIRONMENT
                  value: {{ $.Values.chaos.environment | quote }}
                - name: CHAOS_TARGET_NAMESPACE
                  value: {{ $.Values.executor.demoNamespace | quote }}
                - name: CHAOS_SWITCH
                  value: "{{ include "kaval.fullname" $ }}-chaos-switch"
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                {{- toYaml $.Values.chaos.resources | nindent 16 }}
{{- end }}
{{- end }}

{{- if .Values.postgres.enabled }}
{{- $component := "postgres" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaval.fullname" . }}-postgres
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
type: Opaque
stringData:
  # HOST/PORT point at this same chart's own Service below — the in-cluster Postgres every
  # local/dev/CI environment shares. An environment with its own database server (ADR-0008,
  # KAV-32) never renders this Secret at all; see postgres.enabled and _helpers.tpl's
  # kaval.postgresSecretName.
  POSTGRES_HOST: {{ printf "%s-postgres" (include "kaval.fullname" .) | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password must be set in this environment's own values.yaml" .Values.postgres.password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kaval.fullname" . }}-postgres
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.storageClassName }}
  storageClassName: {{ .Values.postgres.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaval.fullname" . }}-postgres
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
spec:
  # A single replica by design, not a placeholder: this is one PVC with ReadWriteOnce, same
  # as the dev server's own named Docker volume (ADR-0008). Phase 4's standalone DB server is
  # the real HA story; this is the local/CI-shaped environment's database, not production's.
  replicas: 1
  strategy:
    type: Recreate   # two Postgres processes must never share one data directory
  selector:
    matchLabels:
      {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          envFrom:
            - secretRef:
                name: {{ include "kaval.fullname" . }}-postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kaval.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaval.fullname" . }}-postgres
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}

{{- $component := "gateway" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaval.fullname" . }}-gateway
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 8 }}
    spec:
      {{- include "kaval.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: gateway
          image: "{{ include "kaval.image" (dict "root" $ "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "kaval.postgresSecretName" (dict "root" $ "service" "gateway") }}
            {{- if .Values.gateway.slackSecretName }}
            - secretRef:
                # Created out of band — see values.yaml's gateway.slackSecretName comment.
                # Keys: SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_CHANNEL_ID (KAV-55, ADR-0026).
                name: {{ .Values.gateway.slackSecretName }}
            {{- end }}
          env:
            - name: OLLAMA_BASE_URL
              value: {{ .Values.gateway.ollamaBaseUrl | quote }}
            - name: LOCAL_MODEL
              value: {{ .Values.gateway.localModel | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
          # NOT wired to /healthz: that endpoint also checks Ollama reachability
          # (kaval_gateway/main.py's check_ollama()), and no environment's chart deploys Ollama
          # yet — ollamaBaseUrl is empty by default, so /healthz would report unhealthy and a
          # probe pointed at it would crash-loop a gateway that is, in every way that matters
          # to the agent loop running in this chart, actually fine. A TCP check on the app
          # port is an honest "is it up and accepting connections", not a false claim of full
          # health. /healthz itself is still there to curl by hand — see Lab 15.
          readinessProbe:
            tcpSocket:
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaval.fullname" . }}-gateway
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}

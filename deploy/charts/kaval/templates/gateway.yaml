{{- $component := "gateway" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaval.fullname" . }}-gateway
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 8 }}
    spec:
      {{- include "kaval.imagePullSecrets" . | nindent 6 }}
      {{- include "kaval.podSecurity" . | nindent 6 }}
      containers:
        - name: gateway
          image: "{{ include "kaval.image" (dict "root" $ "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "kaval.postgresSecretName" (dict "root" $ "service" "gateway") }}
            {{- if .Values.gateway.slackSecretName }}
            - secretRef:
                # Created out of band — see values.yaml's gateway.slackSecretName comment.
                # Keys: SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_CHANNEL_ID (KAV-55, ADR-0026).
                name: {{ .Values.gateway.slackSecretName }}
            {{- end }}
          env:
            - name: OLLAMA_BASE_URL
              value: {{ .Values.gateway.ollamaBaseUrl | quote }}
            - name: LOCAL_MODEL
              value: {{ .Values.gateway.localModel | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            # Approvals nobody answers (KAV-82, ADR-0048); see values.yaml's `approvals`.
            - name: APPROVAL_REMINDER_MINUTES
              value: {{ .Values.approvals.reminderMinutes | quote }}
            - name: APPROVAL_ESCALATE_MINUTES
              value: {{ .Values.approvals.escalateMinutes | quote }}
            - name: APPROVAL_EXPIRE_MINUTES
              value: {{ .Values.approvals.expireMinutes | quote }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
            - { name: metrics, containerPort: 9100 }
          # Two pages, two questions (KAV-106, ADR-0068). Alive: /livez, which depends on nothing, so
          # a restart is only ever asked for when the program itself is stuck. Ready: /readyz, which
          # needs the migrated database, so a copy cut off from it stops receiving traffic and a
          # rollout waits for it. NOT /healthz: that also checks the language model, and the gateway
          # is not pointed at one (the in-cluster one is the diagnoser's, KAV-87), so a probe on it
          # would take a gateway that is fine out of service. /healthz stays for the watcher and
          # for a person with curl (Lab 15).
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaval.fullname" . }}-gateway
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}

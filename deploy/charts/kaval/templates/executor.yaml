# The only component that mutates anything (CLAUDE.md constraint 3, KAV-47). Everything
# below exists to make that true structurally, not just in application code:
#
# - Its ServiceAccount lives in this release's own namespace ({{ .Release.Namespace }}), same
#   as gateway/agent/postgres — but its Role is granted in a SEPARATE namespace
#   (.Values.executor.demoNamespace, "kaval-demo" by default), bound with a RoleBinding, not
#   a ClusterRoleBinding. The executor therefore has ZERO RBAC grant in its own release's
#   namespace — it cannot touch the very postgres/gateway/agent pods it's deployed alongside,
#   let alone kube-system. That's a stronger guarantee than "scoped to the app namespace"
#   usually buys, and it falls directly out of Kaval's own namespace split, not an extra rule.
# - The Role's rules are exactly the verbs the handlers in `kaval_executor.k8s` call:
#   get, delete on pods (`restart_pod`); get, patch on deployments and get, list on replicasets
#   (`increase_memory_limit`, KAV-79; `rollback_deployment`, KAV-80). The only list is of
#   ReplicaSets, to find a Deployment's earlier version; no watch. RBAC grows in the same PR as
#   the code that would use it, not ahead of it.
# - `kubectl auth can-i delete pods --as=system:serviceaccount:{{ .Release.Namespace }}:
#   {{ include "kaval.fullname" . }}-executor -n {{ .Release.Namespace }}` must say "no" —
#   see Lab 16. That command, not this comment, is the actual proof.

apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.executor.demoNamespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaval.fullname" . }}-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaval.fullname" . }}-executor
  namespace: {{ .Values.executor.demoNamespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  # `increase_memory_limit` (KAV-79, ADR-0044) and `rollback_deployment` (KAV-80, ADR-0045):
  # read a Deployment and change it. `patch` is the only write verb, never create or delete.
  # ReplicaSets are read only: `get` to find a pod's Deployment when the incident names a pod,
  # `list` to find the Deployment's earlier version.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaval.fullname" . }}-executor
  namespace: {{ .Values.executor.demoNamespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaval.fullname" . }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "kaval.fullname" . }}-executor
    namespace: {{ .Release.Namespace }}
{{- if and .Values.removal.enabled (not .Values.costReader.enabled) }}
{{- fail "removal.enabled needs costReader.enabled: the removal worker's answers are read by the cost reader's pod" }}
{{- end }}
{{- if .Values.removal.enabled }}
---
# KAV-95, ADR-0063: the executor's one right in its own namespace. It may `get` and `patch` ONE
# ConfigMap, by name: the orders it hands to the removal worker. Not create (the ConfigMap is made
# below), not list, not any other ConfigMap, not a Secret. This is the only thing that gives the
# executor any right in this namespace; `kubectl auth can-i delete pods -n {{ .Release.Namespace }}`
# still says "no".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kaval.fullname" . }}-executor-orders
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "kaval.fullname" . }}-removal-orders]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kaval.fullname" . }}-executor-orders
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kaval.fullname" . }}-executor-orders
subjects:
  - kind: ServiceAccount
    name: {{ include "kaval.fullname" . }}-executor
    namespace: {{ .Release.Namespace }}
---
# The orders the executor writes and the server's timer carries out to AWS. The data is kept across
# upgrades (read back with `lookup`), so a release never wipes an order that has not been answered.
{{- $orders := printf "%s-removal-orders" (include "kaval.fullname" .) }}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $orders }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $orders }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
data:
  orders.json: {{ if and $existing $existing.data (index $existing.data "orders.json") }}{{ index $existing.data "orders.json" | quote }}{{ else }}'{"orders":[]}'{{ end }}
{{- end }}
---
{{ $component := "executor" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaval.fullname" . }}-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaval.labels" . | nindent 4 }}
    {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaval.selectorLabels" (dict "Release" .Release "component" $component) | nindent 8 }}
    spec:
      {{- include "kaval.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "kaval.fullname" . }}-executor
      automountServiceAccountToken: true
      # The same race agent.yaml already found and fixed (Lab 15): execute_one's first pass
      # can land before postgres is reachable, and the executor's --every loop doesn't retry
      # a connection failure either, it exits.
      {{- include "kaval.podSecurity" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - secretRef:
                name: {{ include "kaval.postgresSecretName" (dict "root" $ "service" "executor") }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2
              done
      containers:
        - name: executor
          image: "{{ include "kaval.image" (dict "root" $ "repository" .Values.executor.image.repository "tag" .Values.executor.image.tag) }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          imagePullPolicy: {{ .Values.executor.image.pullPolicy }}
          args: ["--every", {{ .Values.executor.executeEverySeconds | quote }}]
          envFrom:
            - secretRef:
                name: {{ include "kaval.postgresSecretName" (dict "root" $ "service" "executor") }}
          env:
            # An approval older than this is not acted on (KAV-82, ADR-0048).
            - name: EXECUTOR_APPROVAL_MAX_AGE_MINUTES
              value: {{ .Values.approvals.executorMaxAgeMinutes | quote }}
            # Removal (KAV-95, ADR-0063): the switch, and the one ConfigMap the executor may patch.
            - name: KAVAL_REMOVAL_ENABLED
              value: {{ .Values.removal.enabled | quote }}
            {{- if .Values.removal.enabled }}
            - name: KAVAL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KAVAL_REMOVAL_ORDERS
              value: "{{ include "kaval.fullname" . }}-removal-orders"
            {{- end }}
          ports:
            - { name: metrics, containerPort: 9100 }
          {{- include "kaval.workerReadiness" . | nindent 10 }}
          resources:
            {{- toYaml .Values.executor.resources | nindent 12 }}

# Prometheus rules for Kaval's own health (KAV-78, ADR-0042). Evaluated by Prometheus; the
# collector's Prometheus poller reads which of them are firing (ALERTS) and writes signals.
# Tested with promtool: deploy/charts/kaval/tests/kaval-alerts.test.yaml (make rules-test).
groups:
  - name: kaval-health
    rules:
      # Always firing, on purpose. If the poller can reach Prometheus but this is not in the list
      # of firing alerts, then Prometheus is not evaluating rules at all, which no rule can say.
      - alert: KavalWatchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: Always firing. Its absence means Prometheus is not evaluating its rules.

      # The process is alive and its port answers, but it has not finished a pass for four
      # intervals (and never less than two minutes). The failure a pod's health check cannot see.
      - alert: KavalLoopStalled
        expr: >-
          time() - kaval_loop_last_success_timestamp_seconds
            > clamp_min(4 * kaval_loop_interval_seconds, 120)
        for: 1m
        labels: { severity: critical, kaval_health: "true" }
        annotations:
          summary: "{{ $labels.service }} has not finished a pass for over four intervals."

      # The pod is gone, or its port does not answer. `absent()` is what catches "no pod at all":
      # a pod that does not exist has no `up` series to be 0.
      - alert: KavalTargetDown
        expr: >-
          label_replace(up{job=~"kaval-.+"} == 0, "service", "$1", "job", "kaval-(.+)")
          or label_replace(absent(up{job="kaval-gateway"}), "service", "gateway", "", "")
          or label_replace(absent(up{job="kaval-agent"}), "service", "agent", "", "")
          or label_replace(absent(up{job="kaval-executor"}), "service", "executor", "", "")
          or label_replace(absent(up{job="kaval-collector"}), "service", "collector", "", "")
          or label_replace(absent(up{job="kaval-collector-prometheus"}),
                           "service", "collector-prometheus", "", "")
        for: 2m
        labels: { severity: critical, kaval_health: "true" }
        annotations:
          summary: "{{ $labels.service }} cannot be reached."

  # The approval route is being tried without the right token (KAV-115, ADR-0073). One or two wrong
  # tries is a typo or an old token in your shell; a run of them is someone, or something, guessing.
  # `switched_off` (no token configured) is left out on purpose: that is a setup state, not an attack,
  # and a parked or freshly built environment has it. A counter that has only just appeared counts
  # from its first value, so three tries are needed before this can fire (promtool-tested).
  - name: kaval-approvals
    rules:
      - alert: KavalApprovalRefused
        expr: >-
          label_replace(
            sum(increase(kaval_approval_refused_total{outcome=~"wrong|missing"}[10m])) > 2,
            "service", "gateway", "", "")
        labels: { severity: critical, kaval_health: "true" }
        annotations:
          summary: The approval route has been refused several times in ten minutes (wrong or missing token).

  # The database server's two exporters (KAV-82, ADR-0050). Only meaningful where
  # `prometheus.database.enabled` is on; elsewhere the jobs do not exist and nothing matches.
  # No `absent()` here, deliberately: a parked server has no series and must not page anyone.
  - name: kaval-database
    rules:
      # Postgres itself: the exporter cannot reach it, or reaches it and it says it is down.
      - alert: KavalDatabaseDown
        expr: >-
          label_replace(up{job="database-postgres"} == 0, "service", "database", "", "")
          or label_replace(pg_up == 0, "service", "database", "", "")
        for: 5m
        labels: { severity: critical, kaval_health: "true" }
        annotations:
          summary: The database server cannot be reached, or Postgres is not answering.

      # The machine monitor: while it is silent the database server's disk cannot be watched.
      - alert: KavalDatabaseMonitorDown
        expr: label_replace(up{job="database-node"} == 0, "service", "database-monitor", "", "")
        for: 5m
        labels: { severity: critical, kaval_health: "true" }
        annotations:
          summary: The database server's machine monitor is not answering.

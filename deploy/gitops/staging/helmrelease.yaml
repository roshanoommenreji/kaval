# The staging release itself (KAV-57, ADR-0004). Same chart, same mechanics as
# deploy/gitops/prod/helmrelease.yaml — read that file's header for why `values:` is used
# rather than chart.spec.valuesFiles, why reconcileStrategy is Revision, and how the ECR
# registry hostname is injected at reconcile time instead of being committed.
#
# KNOWN GAP, shared with prod (ADR-0025 Decision 8): `values:` below is a hand-kept copy of
# deploy/environments/staging/values.yaml. Keep the two in sync by hand until release.yml
# exists. CI renders the environments file directly, so only a test of the two files against each
# other can catch a setting that is in one and not the other: scripts/dev/test_gitops_values_in_sync.py
# (added after KAV-81's first game day found a staging setting that never reached the cluster).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaval-staging
  namespace: flux-system
spec:
  interval: 1m
  releaseName: kaval-staging
  targetNamespace: kaval-staging
  chart:
    spec:
      chart: ./deploy/charts/kaval
      sourceRef:
        kind: GitRepository
        name: kaval
      reconcileStrategy: Revision
  # Hand-kept copy of deploy/environments/staging/values.yaml — see the KNOWN GAP note above.
  values:
    postgres:
      enabled: false
      secretNames:
        gateway: kaval-postgres-gateway
        agent: kaval-postgres-agent
        executor: kaval-postgres-executor
        collector: kaval-postgres-collector
        migrate: kaval-postgres-admin
    global:
      imagePullSecretName: ecr-cred
    gateway:
      replicas: 1
      image:
        tag: sha-5f02c84
    agent:
      correlateEverySeconds: 45
      image:
        tag: sha-5f02c84
    executor:
      demoNamespace: kaval-demo-staging
      executeEverySeconds: 20
      image:
        tag: sha-5f02c84
    collector:
      watchEverySeconds: 20
      image:
        tag: sha-5f02c84
    prometheus:
      enabled: true
      disk:
        threshold: 0.38
      database:
        enabled: true
      probe:
        targets: "kaval-demo-staging/chaos-slowpoke=http://chaos-slowpoke.kaval-demo-staging.svc.cluster.local:8080/"
    approvals:
      reminderMinutes: 3
      escalateMinutes: 7
      expireMinutes: 15
    chaos:
      enabled: true
      environment: staging
    ollama:
      enabled: true
    diagnoser:
      enabled: true
    costReader:
      enabled: true
      wasteScan:
        enabled: true
    removal:
      enabled: true
      graceHours: 1
  valuesFrom:
    - kind: ConfigMap
      name: kaval-registry
      valuesKey: registry
      targetPath: global.imageRegistry
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

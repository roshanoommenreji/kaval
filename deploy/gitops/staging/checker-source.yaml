# Where the cluster's image checker (Kyverno) comes from (KAV-140, ADR-0093). Kyverno's own
# chart repository; the chart version is pinned in checker-helmrelease.yaml, and the four images
# the chart runs are pinned by digest there, the way Prometheus is in the Kaval chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno/

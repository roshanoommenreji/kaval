# The prod release itself (KAV-51, ADR-0025).
#
# NOT chart.spec.valuesFiles: that mechanism packages the given files "as the chart values
# (values.yaml)" — source-controller's own wording — which replaces the chart's bundled
# defaults rather than layering on top of them, and silently dropped postgres.storage
# (found live: the PVC rendered "0"). `values:` below merges normally on top of chart
# defaults instead, the same as `helm template -f` everywhere else in this project.
#
# KNOWN GAP, not hidden (ADR-0025 Decision 8): `values:` below is a hand-kept copy of
# deploy/environments/prod/values.yaml, not a reference to it — a configMapGenerator
# reading that file was tried first, but Kustomize refuses to read outside its own
# directory ("file '...' is not in or below"). The two must be kept in sync by hand until
# release.yml (still unbuilt) gives this project a real env-values pipeline; CI's helm-lint
# loop still renders deploy/environments/prod/values.yaml directly, so a drift there is
# caught structurally, just not textually against this file.
#
# The ECR registry hostname is never committed — it embeds the AWS account ID (CLAUDE.md:
# no real account IDs in git). It's injected here at reconcile time from a ConfigMap the
# node's own cloud-init creates from its instance identity document
# (infra/modules/node/user_data.sh.tftpl), merged into global.imageRegistry by
# valuesFrom/targetPath below — see deploy/charts/kaval/values.yaml and
# deploy/charts/kaval/templates/_helpers.tpl's "kaval.image".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaval-prod
  namespace: flux-system
spec:
  interval: 1m
  releaseName: kaval-prod
  targetNamespace: kaval-prod
  chart:
    spec:
      chart: ./deploy/charts/kaval
      sourceRef:
        kind: GitRepository
        name: kaval
      # Default is ChartVersion, which only repackages when Chart.yaml's own `version:`
      # field changes (source-controller's own documented warning) — useless for a
      # GitOps chart whose version nobody bumps by hand on every commit. Revision
      # repackages whenever the GitRepository's revision changes instead (found live,
      # KAV-51: without this, a real template fix merged to main sat un-reconciled
      # indefinitely, Flux silently retrying the stale, pre-fix artifact).
      reconcileStrategy: Revision
  # Hand-kept copy of deploy/environments/prod/values.yaml — see the KNOWN GAP note above.
  values:
    postgres:
      password: kaval-prod-dev
    global:
      imagePullSecretName: ecr-cred
    gateway:
      replicas: 2
      image:
        tag: sha-ffb436b
    agent:
      correlateEverySeconds: 60
      image:
        tag: sha-ffb436b
    executor:
      demoNamespace: kaval-demo-prod
      executeEverySeconds: 30
      image:
        tag: sha-ffb436b
    collector:
      watchEverySeconds: 30
      image:
        tag: sha-ffb436b
  valuesFrom:
    # targetPath entries overwrite everything before them, including the inline `values:`
    # above (Flux's own documented precedence) — the registry injection always wins.
    - kind: ConfigMap
      name: kaval-registry
      valuesKey: registry
      targetPath: global.imageRegistry
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

# Staging, on its own AWS cluster (KAV-57, ADR-0004). Until then (Phase 3, KAV-49) this was
# rehearsed as a second Helm release in the local k3d cluster with a plain dev password; that
# rehearsal is docs/adr/0023-promotion-rehearsal-on-k3d.md. This file now mirrors
# deploy/environments/prod/values.yaml: its own database server, and Flux reconciling it from
# deploy/gitops/staging/helmrelease.yaml (whose inline `values:` is a hand-kept copy of this).
#
# The database server (infra/modules/database, name_prefix kaval-staging). Every service reads
# its own Secret, kaval-postgres-<role> in the kaval-staging namespace. The node's bootstrap
# script creates them from SSM Parameter Store on every boot (KAV-56), so nothing is created by
# hand and no password is ever committed.
postgres:
  enabled: false
  secretNames:
    gateway: kaval-postgres-gateway
    agent: kaval-postgres-agent
    executor: kaval-postgres-executor
    collector: kaval-postgres-collector
    migrate: kaval-postgres-admin

global:
  # The registry itself (the AWS account ID) is injected by Flux's HelmRelease, never committed.
  imagePullSecretName: ecr-cred

gateway:
  # One replica, unlike prod's two: staging proves the artifact, prod's second replica is what
  # lets a rollout proceed without a gap. No slackSecretName: staging has no Slack app of its
  # own, and two environments sharing one Socket Mode app would split events between them.
  replicas: 1
  image:
    # Build once, promote the artifact (ADR-0004): the same sha-ffb436b digest prod runs, pushed
    # to the shared ECR by KAV-51's one-time bootstrap push. Never rebuilt for staging.
    tag: sha-2ac5de6

agent:
  # Wider than local's 30s, narrower than prod's 60s: staging should surface a stuck loop fast.
  correlateEverySeconds: 45
  image:
    tag: sha-2ac5de6

executor:
  # A namespace of its own, not local's `kaval-demo` and not prod's `kaval-demo-prod`.
  demoNamespace: kaval-demo-staging
  executeEverySeconds: 20
  image:
    tag: sha-2ac5de6

collector:
  watchEverySeconds: 20
  image:
    tag: sha-2ac5de6

# Prometheus is on here first (KAV-78, ADR-0042): staging is where its real memory on the 4 GB
# node is measured, and where the "Kaval has stopped" alerts are proven, before prod turns it on
# (KAV-83). Everything else is the chart's default; see `prometheus:` in values.yaml.
prometheus:
  enabled: true
  disk:
    # Lower than the chart's 0.85 so the game day's bounded 3 GiB fill (about 14 points of this
    # 20 GB disk, from about 29 percent) crosses it. Same code path; only the number differs, and
    # the staging disk is nowhere near 38 percent otherwise (ADR-0047).
    threshold: 0.38
  probe:
    # The game day's slow program, when it exists. Nothing is listening here otherwise, which the
    # probe treats as "down", not "slow", so it stays silent.
    targets: "kaval-demo-staging/chaos-slowpoke=http://chaos-slowpoke.kaval-demo-staging.svc.cluster.local:8080/"

# Chaos experiments run here, never in prod (KAV-79, ADR-0044). The switch inside stays off
# until a game day turns it on (`make chaos-run`).
chaos:
  enabled: true
  environment: staging

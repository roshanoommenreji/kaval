# k3d on the dev server (Phase 3, Lab 15). Images are built and imported locally — see the
# lab — never pulled from a registry, so pullPolicy stays IfNotPresent everywhere.
#
# Plain dev credentials, same posture as .env.example: never a real secret, and this file is
# committed because it never holds one. Staging/prod get their own values.yaml with a
# password sourced from a real secret store (Phase 4), not a literal here.
postgres:
  password: kaval-local-dev

gateway:
  replicas: 1
  # Only ever a Secret *name*, never a token (KAV-55, ADR-0026) — created out of band via
  # `kubectl create secret generic kaval-slack --from-literal=SLACK_BOT_TOKEN=... --from-literal=
  # SLACK_APP_TOKEN=... --from-literal=SLACK_CHANNEL_ID=...`, same posture as `ecr-cred`.
  slackSecretName: kaval-slack

agent:
  correlateEverySeconds: 30

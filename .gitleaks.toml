# gitleaks configuration.
#
# This repository goes public at v1, so the HISTORY must be clean, not just the
# working tree. Rewriting history later is painful and easy to get wrong; the
# cheap moment to be strict is now, at commit one.
#
#   gitleaks protect --staged     pre-commit (fast, staged changes only)
#   gitleaks detect               full history scan
#   make secrets-scan             the same, via make

[extend]
useDefault = true

# ─── project-specific rules ──────────────────────────────────

[[rules]]
id = "aws-account-id"
description = "AWS account ID in a committed file"
regex = '''(?i)(aws_?account_?id|account[_-]?id)["'\s:=]+["']?([0-9]{12})["']?'''
tags = ["aws", "identifier"]

[[rules]]
id = "aws-arn-with-account"
description = "ARN containing a real 12-digit account ID"
# Go's re2 has no lookahead, so this can't exclude 000000000000 inline like
# a PCRE engine could. Match any 12-digit account ID instead, and let the
# allowlist regex for "000000000000" (below) clear the placeholder case.
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:'''
tags = ["aws", "identifier"]

[[rules]]
id = "cognito-pool-id"
description = "Cognito user pool ID"
regex = '''[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{9}'''
tags = ["aws", "cognito"]

[[rules]]
id = "expo-push-token"
description = "Expo push token"
regex = '''Expo(nent)?PushToken\[[A-Za-z0-9_-]+\]'''
tags = ["expo", "token"]

[[rules]]
id = "cloudflare-tunnel-token"
description = "Cloudflare tunnel token"
regex = '''(?i)(cloudflared?|tunnel)[_-]?token["'\s:=]+["']?[A-Za-z0-9_\-\.]{40,}["']?'''
tags = ["cloudflare"]

# ─── allowlist ───────────────────────────────────────────────

[allowlist]
description = "Placeholders, examples, and documentation"

paths = [
  '''\.gitleaks\.toml$''',
  '''\.env\.example$''',
  '''.*\.tfvars\.example$''',
  '''docs/.*\.md$''',        # docs must never contain real values anyway — see CLAUDE.md
  # kaval_executor.redact's own tests (KAV-47, ADR-0021): fabricated, secret-SHAPED fixtures
  # — a textbook AWS account id/ARN, a JWT built from `{"alg":"HS256"}`/`{"sub":"a"}`, a
  # base64 "c29tZXNlY3JldA==" (literally the string "somesecret") — that exist specifically
  # to prove the redactor catches that shape. Real secrets never touch this repo (CLAUDE.md);
  # these are the opposite, deliberately realistic-looking so the test is honest.
  '''services/executor/tests/test_redact\.py$''',
  '''services/executor/tests/test_executor_selection\.py$''',
]

regexes = [
  '''000000000000''',                 # placeholder account ID
  '''(?i)you@example\.com''',
  '''(?i)change-?me''',
  '''(?i)<[a-z_-]+>''',               # <your-key-here>
  '''(?i)xxx+''',
  '''(?i)placeholder''',
]

# Kaval architecture, as data.
#
# scripts/tracking/dashboard.py renders this into the #system and #journey views and
# derives each node's state (built / in progress / planned) from that phase's
# marker in ROADMAP.md. Nothing here records status -- ROADMAP.md does.
#
# When a component is added, removed or rewired, update this file. That is a
# Definition of Done item, which is why the diagram stays true.
#
# col and row place the node on a grid; both accept fractions.
# kind: source | service | store | external | platform | target | decision | terminal

# ═══════════════════════════════════════════════════════════════════════
# SYSTEM VIEW — what exists and what talks to what
# ═══════════════════════════════════════════════════════════════════════

# ── row 0: signal sources ──────────────────────────────────────────────

[[system.node]]
id = "k8s-events"
label = "Kubernetes events"
kind = "source"
phase = 3
col = 0
row = 0
credentials = "read-only · watch verb"
inputs = ["Cluster state changes from the API server"]
outputs = ["Event objects: reason, involvedObject, count, message"]
note = "Events expire after roughly an hour and are deduplicated with a count field. They are a stream to consume, never a store to query."

[[system.node]]
id = "prometheus"
label = "Prometheus"
kind = "source"
phase = 3
col = 1
row = 0
credentials = "none · in-cluster HTTP"
inputs = ["Scraped metrics from kubelet, cAdvisor and the services"]
outputs = ["Instant and range query results over /api/v1/query"]
note = "Retention is trimmed deliberately — the node has 4 GB and Prometheus is budgeted at ~400 MB."

[[system.node]]
id = "alertmanager"
label = "Alertmanager"
kind = "source"
phase = 3
col = 2
row = 0
credentials = "none · webhook receiver"
inputs = ["Firing alert rules from Prometheus"]
outputs = ["Webhook POST with alert labels, annotations and status"]
note = "The push half of the signal path. Prometheus is polled; Alertmanager pushes."

[[system.node]]
id = "cost-explorer"
label = "AWS Cost Explorer"
kind = "source"
phase = 7
col = 3
row = 0
credentials = "read-only IAM · ce:GetCostAndUsage"
inputs = ["Account billing data"]
outputs = ["Daily cost grouped by service and tag"]
note = "Daily granularity, ~24 h lag, and $0.01 per API call. This is why the FinOps phase needs the node always-on, and why nothing polls it in a loop."

# ── row 1: ingest ──────────────────────────────────────────────────────

[[system.node]]
id = "collector"
label = "collector"
kind = "service"
phase = 1
col = 1.5
row = 1
credentials = "read-only — Kubernetes RBAC and IAM"
inputs = [
  "Kubernetes events API (watch)",
  "Prometheus /api/v1/query",
  "Alertmanager webhook receiver",
  "Cost Explorer GetCostAndUsage",
]
outputs = ["signal rows — INSERT only"]
tables = ["signal"]
note = "Normalises four unlike sources into one shape. The database is the record; the event stream is only the feed. Phase 1 runs only the synthetic source (KAV-23); the real ones write the same row shapes from Phase 3."

[[system.node]]
id = "synthetic"
label = "synthetic signals"
kind = "source"
phase = 1
col = 4.2
row = 0
credentials = "database INSERT on signal only"
inputs = ["make signals SCENARIO=… [SEED=…]"]
outputs = ["One fake incident's signals in real payload shapes: OOM crashloop, exec-format, cost spike, idle volume"]
tables = ["signal"]
note = "Stands in for the cluster and the bill until they exist (KAV-23, Lab 05). Every row carries synthetic: true, the scenario and a run_id, so a fake can never pass for real. Same seed, same content; every run a fresh run_id."

# ── row 2: the store ───────────────────────────────────────────────────

[[system.node]]
id = "db"
label = "Postgres + pgvector"
kind = "store"
phase = 1
col = 1.5
row = 2
credentials = "per-service roles"
inputs = ["Writes from collector, agent, gateway and executor"]
outputs = ["Signals, incidents, runbook embeddings, proposal and outcome history"]
tables = ["signal", "incident", "proposal", "action", "decision", "execution", "outcome"]
note = "Append-only. Nothing is updated in place, so the tables ARE the audit trail — which is what makes the ISO 42001 human-oversight claim true rather than aspirational. Placement (ADR-0008): a container on the dev server in Phases 1–3; its own t4g.small server (db-host) from Phase 4, never inside the app node. Same pgvector/pgvector:pg16 image everywhere."

# ── row 3: reasoning ───────────────────────────────────────────────────

[[system.node]]
id = "inference"
label = "local model (Ollama)"
kind = "service"
phase = 1
col = 0
row = 3
credentials = "none"
inputs = ["Prompt with retrieved context, OpenAI-compatible API"]
outputs = ["Completion tokens, token counts"]
note = "Measured on the 4 GB Graviton dev server (KAV-22, docs/architecture/model-shortlist.md): 1.1–1.9 GB loaded, 11–21 tokens/sec, 9–12 s per diagnosis. Called schema-constrained, which made every shortlisted model produce valid proposals. Shortlist for the Phase 2 evals: gemma3:1b-it-qat (dev default), llama3.2:1b, qwen3:1.7b. Viable because diagnosis is asynchronous — nobody is watching a cursor blink."

[[system.node]]
id = "agent"
label = "agent"
kind = "service"
phase = 2
col = 1.5
row = 3
credentials = "READ-ONLY — no write verb exists in any binding"
inputs = [
  "signal rows awaiting correlation",
  "Runbook chunks retrieved by vector similarity",
  "Similar past incidents and their measured outcomes",
]
outputs = ["proposal rows — INSERT only. This is its ONLY possible output."]
tables = ["signal", "incident", "proposal", "action"]
note = "Correlation (make correlate, KAV-39): signals in, incident rows out. Context assembly (make context, KAV-40): runbook RAG + past incidents + recent changes. Diagnosis (make diagnose, KAV-41): calls the local model schema-constrained, re-validates with Pydantic regardless, writes proposal + action rows. Each action's policy_class (KAV-42, ADR-0017) comes from the policy node, not the model. The component that thinks has no hands. Even fully compromised, it can only write a suggestion into a table — which is the mitigation for prompt injection through telemetry, the primary threat to this system."

[[system.node]]
id = "bedrock"
label = "Amazon Bedrock"
kind = "external"
phase = 2
col = 3
row = 3
credentials = "read-only IAM · bedrock:InvokeModel"
inputs = ["Prompt for novel or low-confidence incidents"]
outputs = ["Completion, token counts, measured cost"]
note = "Escalation path only. Cost is recorded on both routes, so the saving from cost-aware routing is measured rather than claimed."

[[system.node]]
id = "jev"
label = "Jev (TypeSafe API)"
kind = "external"
phase = 2
col = 3
row = 4
credentials = "API key · read-only decision call"
inputs = ["Redacted incident state + proposed action, with typed questions"]
outputs = ["blast_radius choice, reversible and fit probabilities, input-token cost"]
note = "Rates risk, never decides it. Its ratings can only make a policy class stricter; never is decided from the action type, and nothing Jev returns promotes ask to auto. If it's unavailable, everything goes to ask. ADR-0006."

# ── row 4: governance ──────────────────────────────────────────────────

[[system.node]]
id = "policy"
label = "OPA policy"
kind = "library"
phase = 2
col = 1.5
row = 4
credentials = "none · pure evaluation"
inputs = ["A proposed action: type, target, blast_radius, reversible, confidence"]
outputs = ["A class: auto | ask | never"]
note = "kaval_agent.policy shells out to opa eval against policy/policy.rego, embedded in the agent process rather than a standalone server — one caller today (the agent); a shared server is worth it once the executor (Phase 3) becomes a second one, per ADR-0017. Same Rego source will ship in the executor's image too: one definition, two enforcement points, without a network hop. never ignores confidence, matching keywords in the action's type (pvc, iam, ec2, billing, ...) plus blast_radius=account, regardless of how confident the model is. auto is gated by an explicit, empty-by-default promotion list (policy/promotions.json) — the rule cannot return auto for any input until an ADR adds an entry citing outcome evidence, which is what makes \"nothing is born auto\" a property of the code, not just a design sentence."

# ── row 5: the human interface ─────────────────────────────────────────

[[system.node]]
id = "gateway"
label = "gateway (FastAPI)"
kind = "service"
phase = 1
col = 1.5
row = 5
credentials = "own database role · Cognito JWT verification"
inputs = ["Signals, incidents and pending proposals from the database", "Approve/deny from the mobile app"]
outputs = ["REST + WebSocket to the app (today: read-only /v1 signals and incidents, OpenAPI at /docs)", "Push dispatch", "decision rows"]
tables = ["proposal", "decision"]
note = "Verifies the JWT signature against Cognito's public keys — decoding a token and trusting its claims is the classic vulnerability. Until Phase 5 it has no auth and no writes: it binds to 127.0.0.1 and every request runs in a READ ONLY transaction (ADR-0009, KAV-23)."

[[system.node]]
id = "tunnel"
label = "Cloudflare Tunnel"
kind = "platform"
phase = 4
col = 3
row = 5
credentials = "tunnel token"
inputs = ["Outbound connection from inside the cluster"]
outputs = ["Public HTTPS hostname, stable across node replacement"]
note = "Replaces an $18/month Application Load Balancer. No inbound port is open — the security group needs no ingress rule at all."

[[system.node]]
id = "mobile"
label = "Expo app"
kind = "external"
phase = 5
col = 4.2
row = 5
credentials = "Cognito tokens · refresh token in the device keystore"
inputs = ["Push notification carrying only an incident ID", "REST responses"]
outputs = ["Approve or deny, with an optional reason"]
note = "The push payload carries an ID and nothing else — delivery is best-effort and the path is not trusted with incident detail. The approval screen must state what happens if you decline, not only if you approve."

# ── row 6: action ──────────────────────────────────────────────────────

[[system.node]]
id = "executor"
label = "executor"
kind = "service"
phase = 3
col = 1.5
row = 6
credentials = "SCOPED WRITE — RoleBinding in the app namespace only; IRSA on EKS"
inputs = ["Approved proposals", "A second policy evaluation before every action"]
outputs = ["Cluster and AWS mutations", "execution and outcome rows"]
tables = ["execution", "outcome"]
note = "The only component that changes anything, and it never calls an LLM. Bound with a RoleBinding rather than a ClusterRoleBinding, so it structurally cannot touch kube-system — blast radius is enforced below the application code."

[[system.node]]
id = "chaos"
label = "chaos CronJobs"
kind = "service"
phase = 6
col = 3.6
row = 6
credentials = "scoped write · labelled namespace only"
inputs = ["A schedule, or a manual make chaos-run"]
outputs = ["Injected faults: OOM kill, crashloop, disk fill, latency, node drain"]
note = "Confined to namespaces labelled kaval.io/chaos=enabled. The containment is tested before the experiments are trusted, because the chaos tooling is itself dangerous."

# ── row 7: what gets changed ───────────────────────────────────────────

[[system.node]]
id = "cluster"
label = "Kubernetes cluster"
kind = "target"
phase = 3
col = 0.5
row = 7
credentials = "acted on by executor only"
inputs = ["patch, delete, scale, cordon — from the executor"]
outputs = ["New state, which becomes new events"]
note = "k3s on one spot instance in production; EKS during the Phase 8 chapter. The same Helm chart deploys to both, differing only by values file."

[[system.node]]
id = "aws-apis"
label = "AWS APIs"
kind = "target"
phase = 7
col = 2.5
row = 7
credentials = "scoped IAM via IRSA — no static keys"
inputs = ["Cost remediation: stop idle, delete orphaned volumes, scale down"]
outputs = ["Changed resources, changed bill"]
note = "IRSA gives the executor a per-ServiceAccount role through OIDC federation, so no long-lived credential exists anywhere in the cluster."

# ── row 8: platform ────────────────────────────────────────────────────

[[system.node]]
id = "node"
label = "t4g.medium spot"
kind = "platform"
phase = 4
col = 0
row = 8
credentials = "instance role"
inputs = ["cloud-init user data", "Container images from ECR"]
outputs = ["A k3s cluster, rebuilt from Git in under 5 minutes"]
note = "ARM/Graviton — every image must be linux/arm64 or it fails at runtime with exec format error. ~$9.20/month on spot against ~$24 on-demand. AWS may reclaim it with two minutes' notice, which chaos-tests the rebuild path continuously and for free."

[[system.node]]
id = "db-host"
label = "DB server · t4g.small"
kind = "platform"
phase = 4
col = 1
row = 8
credentials = "instance role (SSM only) · no SSH"
inputs = ["Postgres connections on 5432, only from the app node's security group", "Admin sessions via SSM Session Manager"]
outputs = ["Postgres 16 + pgvector over TLS", "Daily EBS snapshots and a snapshot before every stop"]
note = "ADR-0008. On-demand, never spot: a database must not be reclaimable at two minutes' notice. ~$14.40/month always-on. Termination protection on; passwords in SSM Parameter Store. No idle stop, because its user is the app: it stops only with make down, the paused-posture nightly auto-stop, or the $38 hard stop, each taking a snapshot first. Staging gets its own from the same module."

[[system.node]]
id = "ebs"
label = "EBS gp3 data volume"
kind = "platform"
phase = 4
col = 1
row = 9
credentials = "attached volume"
inputs = ["Postgres data directory on the DB server"]
outputs = ["Durable storage surviving instance replacement", "DLM snapshots, keep 7"]
note = "20 GB encrypted gp3, prevent_destroy, same AZ as the app node. Separate from the DB server's root disk, so replacing the instance never touches the data (ADR-0008)."

[[system.node]]
id = "ecr"
label = "ECR"
kind = "platform"
phase = 4
col = 2
row = 8
credentials = "IAM-authenticated pull"
inputs = ["arm64 images pushed by CI"]
outputs = ["Images pulled by the node"]
note = "First 500 MB free."

[[system.node]]
id = "s3"
label = "S3 backups"
kind = "platform"
phase = 4
col = 3
row = 8
credentials = "scoped write"
inputs = ["Nightly pg_dump"]
outputs = ["Restorable database snapshots"]
note = "Nightly pg_dump. RPO is 24 hours — a decision, not a default (ADR-0005). Every `make staging-up` restores this snapshot into staging, so the backup is verified several times a month rather than never."

[[system.node]]
id = "guardrail"
label = "budget guardrail"
kind = "platform"
phase = 0
col = 4.2
row = 8
credentials = "autoscaling:UpdateAutoScalingGroup only"
inputs = ["AWS Budgets threshold breach via SNS"]
outputs = ["ASG desired capacity set to zero at $38", "Project=kaval servers outside an ASG stopped at $38 (dev server; DB server from Phase 4)"]
note = "The first thing built, before any compute existed. Ships with DRY_RUN=true and no target, so the first invocation is a safe no-op that still proves the whole path — budget, SNS, subscription, function, log. Applied and proven 2026-09-15 — 10 resources, full console-location + purpose table in Lab 01. Armed 2026-09-26 (KAV-30) to stop running Project=kaval servers outside an ASG, e.g. the dev server; fired for real and proven. Thresholds moved to $30/$35/$38 with the $40 ceiling on 2026-09-26 (ADR-0008)."


# ═══════════════════════════════════════════════════════════════════════
# JOURNEY VIEW — one incident, every branch
# ═══════════════════════════════════════════════════════════════════════

[[journey.node]]
id = "fault"
label = "Fault occurs"
kind = "source"
phase = 6
col = 1
row = 0
note = "Real, or injected by a chaos CronJob. Chaos experiments carry a falsifiable hypothesis — 'the agent detects this within 30 seconds' — which is what separates an experiment from an outage you caused."

[[journey.node]]
id = "j-signal"
label = "Signal recorded"
kind = "service"
phase = 1
col = 1
row = 1
note = "Target: within 30 seconds. The database is the record; the event stream is only the feed, because Kubernetes events expire in about an hour."

[[journey.node]]
id = "j-correlate"
label = "Correlate → incident"
kind = "service"
phase = 2
col = 1
row = 2
note = "Built (KAV-39, ADR-0014): kaval_agent.correlate groups unlinked signals by subject (namespace/workload, or the AWS resource) and names the incident by its most specific cause. Fingerprint cause:domain:subject, e.g. oom_killed:k8s:kaval-demo/checkout. A group opens 60 s after its first signal; an incident closes after 15 min quiet (48 h for AWS). A recurrence is a new incident with the same fingerprint, so history builds up. Too broad and unrelated failures merge; too narrow and retrieval finds nothing."

[[journey.node]]
id = "j-context"
label = "Build context (RAG)"
kind = "service"
phase = 2
col = 1
row = 3
note = "Built (KAV-40, ADR-0015): kaval_agent.context assembles all three. Runbooks chunked by ## heading, embedded with all-minilm, retrieved by pgvector cosine similarity (cutoff 0.5, measured against real data). Past incidents matched by cause+domain (exact fingerprint first), not embeddings — the fingerprint is already more precise. Recent changes: a laptop-only git-log proxy until Phase 3's real deploy signals exist. The outcome of a similar past incident is the single most useful element — stronger evidence than any amount of general knowledge."

[[journey.node]]
id = "j-known"
label = "Seen before?"
kind = "decision"
phase = 2
col = 1
row = 4
note = "pgvector similarity against the incident history. This routing decision is what makes a 1B model sufficient for most cases."

[[journey.node]]
id = "j-local"
label = "local model · Ollama"
kind = "service"
phase = 2
col = 0
row = 5
note = "Effectively free — amortised node cost only. Handles incidents resembling ones already seen. Dev default gemma3:1b-it-qat; the Phase 2 evals pick between it, llama3.2:1b and qwen3:1.7b (docs/architecture/model-shortlist.md)."

[[journey.node]]
id = "j-bedrock"
label = "Bedrock · escalated"
kind = "external"
phase = 2
col = 2
row = 5
note = "Novel or low-confidence cases. Tokens and cost recorded, so cost-per-incident is measurable on both paths."

[[journey.node]]
id = "j-validate"
label = "Schema validation"
kind = "service"
phase = 2
col = 1
row = 6
note = "Pydantic, via kaval_agent.diagnose (KAV-41, ADR-0016). Invalid output gets one corrective retry, then is rejected; it never reaches the database. Note that schema validity is not semantic validity — confirmed live, not hypothetically: gemma3:1b-it-qat returned confidence: 70 despite Ollama's format schema stating maximum: 1, and it was this Pydantic re-check, not the constrained decoding, that caught it."

[[journey.node]]
id = "j-policy"
label = "Policy class?"
kind = "decision"
phase = 2
col = 1
row = 7
note = "OPA evaluates each action against blast_radius, reversible and confidence, which Jev rates (ADR-0006) and which can only make a class stricter. Everything starts in ask; a class only graduates to auto when an explicit promotion entry (policy/promotions.json) cites outcome-table evidence in an ADR — the rule cannot return auto for any input while that list is empty, which is enforced, not just documented (ADR-0017)."

[[journey.node]]
id = "j-never"
label = "DROP + log"
kind = "terminal"
phase = 2
col = -0.15
row = 8
note = "never ignores confidence entirely. Delete a PVC or namespace, mutate IAM, terminate EC2, touch billing — refused regardless of how certain the model is."

[[journey.node]]
id = "j-ask"
label = "Human decides"
kind = "decision"
phase = 5
col = 1.1
row = 8
note = "Push to phone within 60 seconds. This stage is unbounded and usually dominates wall-clock MTTR — which is the architecture working as designed, not a defect, but it means MTTR is honestly two numbers."

[[journey.node]]
id = "j-auto"
label = "Auto-approved"
kind = "service"
phase = 6
col = 2.4
row = 8
note = "blast_radius=pod AND reversible AND confidence>0.9 AND outcome evidence exists. Nothing is born auto."

[[journey.node]]
id = "j-deny"
label = "Denied + logged"
kind = "terminal"
phase = 5
col = 0.4
row = 9
note = "A denial is data. It is recorded with its reason and becomes evidence against promoting that action class to auto."

[[journey.node]]
id = "j-approve"
label = "Approved"
kind = "service"
phase = 5
col = 1.7
row = 9
note = "Recorded with actor and timestamp in the decision table, append-only."

[[journey.node]]
id = "j-recheck"
label = "Executor re-checks policy"
kind = "service"
phase = 3
col = 1.7
row = 10
note = "The same policy definition, a second enforcement point. Not redundant — this is what makes a compromised agent harmless."

[[journey.node]]
id = "j-exec"
label = "Execute · record before/after"
kind = "service"
phase = 3
col = 1.7
row = 11
note = "Scoped RBAC, namespace-bound. Before and after state captured so the action is auditable and, where reversible, undoable."

[[journey.node]]
id = "j-ok"
label = "Success"
kind = "service"
phase = 3
col = 1
row = 12
note = ""

[[journey.node]]
id = "j-fail"
label = "Failure → escalate"
kind = "terminal"
phase = 3
col = 2.4
row = 12
note = "Execution failure is itself a signal. It re-enters the loop rather than being swallowed."

[[journey.node]]
id = "j-outcome"
label = "Outcome measured at +5 min"
kind = "store"
phase = 6
col = 1.7
row = 13
note = "resolved true or false, mttr_sec, regression. Measured, not assumed — an action that ran successfully but did not fix the incident is a different outcome from one that did."

[[journey.node]]
id = "j-feedback"
label = "Feeds the next context"
kind = "store"
phase = 2
col = 1.7
row = 14
note = "This is what closes the loop and what makes progressive autonomy possible — the evidence for promoting a class to auto lives in these rows."

[[journey.edge]]
from = "fault"
to = "j-signal"
label = "detected ≤30s"

[[journey.edge]]
from = "j-signal"
to = "j-correlate"
label = ""

[[journey.edge]]
from = "j-correlate"
to = "j-context"
label = "fingerprint"

[[journey.edge]]
from = "j-context"
to = "j-known"
label = ""

[[journey.edge]]
from = "j-known"
to = "j-local"
label = "yes · similar found"

[[journey.edge]]
from = "j-known"
to = "j-bedrock"
label = "no · or low confidence"

[[journey.edge]]
from = "j-local"
to = "j-validate"
label = ""

[[journey.edge]]
from = "j-bedrock"
to = "j-validate"
label = ""

[[journey.edge]]
from = "j-validate"
to = "j-policy"
label = "valid proposal"

[[journey.edge]]
from = "j-policy"
to = "j-never"
label = "never"

[[journey.edge]]
from = "j-policy"
to = "j-ask"
label = "ask"

[[journey.edge]]
from = "j-policy"

# ═══════════════════════════════════════════════════════════════════════
# DELIVERY VIEW — how a change reaches production
# ═══════════════════════════════════════════════════════════════════════
#
# Deliberately the same shape as the product: validate, gate, human-approve,
# execute, verify. See ADR-0004 and docs/learn/release-engineering.md.

[[delivery.node]]
id = "d-local"
label = "Local · k3d"
kind = "source"
phase = 3
col = 2
row = 0
note = "The inner loop. A throwaway k3d cluster on the AWS dev server (ADR-0007), which stops itself when idle, where manifests and RBAC are proven before staging is involved."

[[delivery.node]]
id = "d-pr"
label = "Pull request"
kind = "service"
phase = 1
col = 2
row = 1
note = "Short-lived branch, merged to main frequently. Long-lived feature branches produce large merges, and large merges are where incidents come from."

[[delivery.node]]
id = "d-ci"
label = "CI · lint test scan"
kind = "service"
phase = 1
col = 2
row = 2
inputs = ["The pull request head commit"]
outputs = ["Pass or fail. Builds an arm64 image but never pushes it."]
note = ".github/workflows/ci.yml (KAV-24, ADR-0010), five parallel jobs: ruff + mypy · migrations up/check/down/up and pytest against a real pgvector Postgres · gitleaks over full history · terraform fmt + offline validate · both images built natively on an arm64 runner, checked for arm64 and a non-root user, and Trivy-scanned. opa test joins in Phase 2, when policies exist. Deliberately builds without pushing: a PR proves it builds for Graviton without publishing an artifact."

[[delivery.node]]
id = "d-cigate"
label = "CI green?"
kind = "decision"
phase = 1
col = 2
row = 3
note = "A mechanical criterion: every check green, or no merge. No human judgement is involved or wanted here. Until the repo goes public (Phase 9) GitHub Free cannot enforce it on a private repo, so it is a written rule (docs/contributing.md); after that, a required status check on main."

[[delivery.node]]
id = "d-blocked"
label = "Blocked · fix and push"
kind = "terminal"
phase = 1
col = 0.6
row = 4
note = "Nothing is published. The branch stays a branch."

[[delivery.node]]
id = "d-merge"
label = "Merge to main"
kind = "service"
phase = 1
col = 2
row = 4
note = "Conventional commits carrying the KAV key, checked by a commit-msg hook and by CI (ADR-0011). GitHub for Atlassian links each commit, branch and PR to its issue by that key; status moves with jira-sync.py, since smart-commit commands need the commit email to match a Jira user and this repo commits under the noreply address."

[[delivery.node]]
id = "d-build"
label = "Build once → ECR"
kind = "service"
phase = 4
col = 2
row = 5
outputs = ["One arm64 image, tagged sha-<short>, referenced by digest"]
note = "BUILD ONCE. A rebuild from the same commit can differ — base images move, dependencies resolve differently — so a rebuild is a different artifact, and staging then tested something else."

[[delivery.node]]
id = "d-sign"
label = "SBOM + cosign sign"
kind = "service"
phase = 9
col = 2
row = 6
note = "syft generates the bill of materials, cosign signs keylessly against the CI identity. Together they answer 'are we affected?' in minutes when the next widely-publicised CVE lands."

[[delivery.node]]
id = "d-stgup"
label = "make staging-up"
kind = "platform"
phase = 4
col = 2
row = 7
note = "Terraform creates a second t4g.medium spot node with its own k3s, etcd, database and VPC, then restores the latest production snapshot through scripts/ops/anonymise.sql. Staging gets real data shape and volume, and the backup gets restore-tested on every release. About five minutes."

[[delivery.node]]
id = "d-stg"
label = "Deploy to staging"
kind = "target"
phase = 4
col = 2
row = 8
note = "Exact parity with prod: same instance type, same 4 GB, same local model. That matters because memory pressure is this project's binding constraint, and a smaller staging node would miss precisely that."

[[delivery.node]]
id = "d-smoke"
label = "Smoke + policy tests?"
kind = "decision"
phase = 4
col = 2
row = 9
note = "Does the loop actually work on a real cluster, and does OPA still refuse every never-class action?"

[[delivery.node]]
id = "d-stgfail"
label = "Destroyed · nothing ships"
kind = "terminal"
phase = 4
col = 0.6
row = 10
note = "Staging is torn down, the digest is never promoted, and the failure is the signal."

[[delivery.node]]
id = "d-notes"
label = "Release notes generated"
kind = "service"
phase = 4
col = 2
row = 11
note = "Named Kaval X.Y.Z with the component versions it carries (ADR-0013), each bumped from the conventional commits touching that component since its last tag. Lists the Jira issues named by their KAV keys, grouped by Service, and each uat story's sign-off (ADR-0012). Generated, so it is accurate and costs nothing per release."

[[delivery.node]]
id = "d-approve"
label = "Human approves?"
kind = "decision"
phase = 4
col = 2
row = 12
note = "workflow_dispatch today — a deliberate manual run is the gate. Becomes GitHub Environments with required reviewers once the repo is public, since deployment protection rules are a paid feature on private repos."

[[delivery.node]]
id = "d-held"
label = "Held · no deploy"
kind = "terminal"
phase = 4
col = 0.6
row = 13
note = "A gate that has never refused anything is a step wearing a gate's clothes."

[[delivery.node]]
id = "d-promote"
label = "promote.yml"
kind = "service"
phase = 4
col = 2
row = 13
note = "Deploys the artifact. It does not build one."

[[delivery.node]]
id = "d-digest"
label = "Same digest as staging?"
kind = "decision"
phase = 4
col = 2
row = 14
note = "The check that makes build-once real rather than aspirational. Tested with a deliberate negative case — promoting an unproven digest must be refused."

[[delivery.node]]
id = "d-refused"
label = "REFUSED"
kind = "terminal"
phase = 4
col = 0.6
row = 15
note = "An artifact that did not pass staging cannot reach production, regardless of who asks."

[[delivery.node]]
id = "d-prod"
label = "Deploy to prod"
kind = "target"
phase = 4
col = 2
row = 15
note = "Rolling update. Two versions coexist for a few seconds, which is why migrations must be backward-compatible — expand, migrate, then contract in a later release, never the same one."

[[delivery.node]]
id = "d-verify"
label = "Post-deploy verify?"
kind = "decision"
phase = 4
col = 2
row = 16
note = "Health, smoke, and the agent loop still functioning. Verified after the fact rather than assumed."

[[delivery.node]]
id = "d-rollback"
label = "rollback.yml · timed"
kind = "terminal"
phase = 3
col = 0.6
row = 17
note = "helm rollback to the previous revision, measuring time-to-restore. That measured figure goes into the next change record, because 'we would roll back' is not a plan."

[[delivery.node]]
id = "d-record"
label = "Change record written"
kind = "store"
phase = 4
col = 2
row = 17
note = "docs/releases/YYYY-MM-DD-vX.Y.Z.md — digests, changes, linked issues, derived risk, staging evidence, the rollback plan with its last measured time, and the verification result."

[[delivery.node]]
id = "d-jira"
label = "Jira version released"
kind = "store"
phase = 4
col = 2
row = 18
note = "Fix Version marked released by promote.yml, issues transitioned to Done. The board reflects reality without anyone dragging a card across it. Until Phase 4, jira-sync.py moves issues by hand (ADR-0011); the GitHub link already shows each issue its commits and PRs."

[[delivery.node]]
id = "d-dora"
label = "DORA metrics updated"
kind = "store"
phase = 4
col = 2
row = 19
note = "Deployment frequency and lead time measure speed; change failure rate and time to restore measure stability. Reporting only one pair is how teams justify shipping recklessly, or never shipping at all."

[[delivery.node]]
id = "d-uat"
label = "UAT signed off?"
kind = "decision"
phase = 4
col = 2
row = 10
note = "Only for releases carrying stories labelled uat (ADR-0012). Roshan accepts each one as the user, on staging, against its UAT scenarios, and records the verdict with jira-sync.py uat pass|fail. promote.yml refuses a release with a uat story not yet signed off. Verification (tests) asks whether it was built right; UAT asks whether it is the right thing."

[[delivery.node]]
id = "d-uatfail"
label = "Bug raised · back to work"
kind = "terminal"
phase = 4
col = 0.6
row = 11
note = "uat fail records who, where and what broke, raises a linked Bug (uat-defect, Service copied, Found in = staging) and moves the story back to In Progress. The story can't pass UAT while that Bug is open."


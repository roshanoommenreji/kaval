# Configuration for scripts/tracking/dashboard.py
#
# Everything the dashboard cannot derive from the repository lives here.
# Status is NEVER recorded in this file — ROADMAP.md is the single source of
# truth for what is done. This holds links and figures only.

[project]
name        = "Kaval"
tagline     = "കാവൽ — the watch"
started     = "2026-08-22"
target_v1   = "2027-03-31"
phase_count = 10

[cost]
ceiling_usd        = 40         # was 25; raised by ADR-0008 (database on its own server)
projected_total    = 110        # was 52; +$15 dev server (ADR-0007); +$42 database server (ADR-0008)
budget_with_buffer = 140        # the AWS credit, expires 2027-09-11
alert_1_usd        = 30         # must match infra/envs/prod/terraform.tfvars
alert_2_usd        = 35
hard_stop_usd      = 38
mtd_usd            = 0.0        # updated from `make cost-report`; 0 while nothing is provisioned
provisioned        = true       # the dev server (ADR-0007) since 2026-09-26

# Promotion path. `promotion = false` means it is a deployment target but NOT
# a quality gate — lab-eks proves chart portability, it does not gate anything.
# See ADR-0004.
[[environments]]
name      = "local"
where     = "AWS dev server, t4g.medium on-demand · Docker, later k3d (ADR-0007)"
lifetime  = "while working, stops after 1 h idle"
promotion = true
cost      = "~$5/mo"

[[environments]]
name      = "staging"
where     = "2nd t4g.medium spot node · own k3s, etcd, DB, VPC"
lifetime  = "per release, self-destructs after 4 idle hrs"
promotion = true
cost      = "~$1/mo"

[[environments]]
name      = "prod"
where     = "t4g.medium spot node · own k3s"
lifetime  = "paused → always-on from Phase 7"
promotion = true
cost      = "~$14/mo"

[[environments]]
name      = "lab-eks"
where     = "ephemeral EKS"
lifetime  = "per Phase 8 session"
promotion = false
cost      = "~$4/session"

# Run posture per phase — see docs/cost/budget-plan.md
[posture]
0 = { state = "local",      cost = "$0" }
1 = { state = "dev-server", cost = "~$5/mo" }
2 = { state = "dev-server", cost = "~$5/mo" }
3 = { state = "dev-server", cost = "~$5/mo" }
4 = { state = "paused",     cost = "~$2.20/mo" }
5 = { state = "paused",     cost = "~$2.20/mo" }
6 = { state = "paused",     cost = "~$2.20/mo" }
7 = { state = "always-on",  cost = "~$14/mo" }
8 = { state = "always-on",  cost = "~$14/mo + $4/lab" }
9 = { state = "always-on",  cost = "~$14/mo" }

# Per-phase Jira epic + (where real content exists) Confluence link. `confluence`
# is deliberately omitted for phases with nothing phase-specific published yet —
# a missing link here is honest, not a gap to paper over with a generic page.
[phase_links]

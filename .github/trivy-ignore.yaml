# scan passes with no exception. Five exceptions for that binary came before: CVE-2026-78667, -97031, -78669 and -111943 (the
# first four, ended when OPA v1.21.3 and then v1.21.4 were pinned) and CVE-2026-78661 (KAV-130, to 2026-11-21, ended by KAV-132).
# The file stays, empty, because both scans still read it and the next finding needs a place to be written down under the

# Release, stage one: build the images once, publish them, and ask for staging to run them
# (KAV-61, ADR-0030, building on ADR-0004 "build once, promote the artifact").
#
#   merged change to a service  ->  build 5 images (arm64, scanned)  ->  push to ECR as sha-<short>
#     ->  open a pull request that points staging at that tag  ->  CI runs on it  ->  you merge
#     ->  staging's Flux pulls the new tag the next time staging is up.
#
# Staging deploys the same way prod does: a tag committed to Git, pulled by Flux. CI never gets
# credentials to a cluster. The smoke test and the "this digest passed staging" record are made
# by hand-run tooling (ADR-0031). Component version tags are made here once the images exist
# (ADR-0035); release-prepare.yml writes the version bumps, and promote.yml generates the change
# record. promote.yml and rollback.yml build on all of that.
#
# What this workflow is allowed to do, and why that is the whole security story:
#   - The two jobs have different powers. `publish` can reach AWS (OIDC; push to and read from the
#     five Kaval repositories only, and it signs what it pushes, KAV-138) but
#     cannot write to the repository. `propose` can write a branch and open a pull request but
#     has no AWS access at all. No job has both.
#   - AWS accepts only a job from this repository running on `main` (infra/modules/ci-publish).
#     A pull request, a fork or another branch is refused, so nobody can use this role by
#     editing the workflow on a branch.
#   - Nothing here pushes to `main`. Branch protection stays in charge: the pin goes through a
#     pull request and the same required checks as any other change. CI's first run on that
#     pull request waits for a person to approve it, which is deliberate.
#   - Every third-party action is pinned to a full commit SHA, as in ci.yml.

name: release

on:
  push:
    branches: [main]
    # Only changes that alter an image. The pin pull request touches deploy/ only, which is
    # not listed, so merging it can never start another release (no loop).
    paths:
      - "services/**"
      - "migrations/**"
      - "policy/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/ops/backup.sh"
      - "scripts/ops/restore.sh"
      - "scripts/ops/db-roles.sql"
      - "scripts/ops/anonymise.sql"
  workflow_dispatch:

# No job gets any permission it does not ask for.
permissions: {}

# Two releases at once would race to publish and to open the same branch. Queue, don't cancel:
# a half-finished publish is worse than a late one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5" # Linux-ARM64
  # The signing tool (KAV-138, ADR-0090): fixed version and checksum, like Trivy, so a changed
  # download is refused instead of run. The checksum is from the release's own checksum file.
  COSIGN_VERSION: "3.1.4"
  COSIGN_SHA256: "ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2" # linux-arm64
  # Who may have signed an image: this workflow, on main, as GitHub vouches for it. Written out in
  # full, never a pattern, so a signature from any other workflow or branch is refused.
  SIGNER_IDENTITY: "https://github.com/roshanoommenreji/kaval/.github/workflows/release.yml@refs/heads/main"
  SIGNER_ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  publish:
    name: publish ${{ matrix.service }} (arm64 build, Trivy, push)
    # Native Graviton-class runner: built on the architecture it runs on (CLAUDE.md constraint 2).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      id-token: write # to ask GitHub for the OIDC token AWS checks, and to sign the build record
      attestations: write # to store the signed build record (KAV-137)
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, collector, agent, executor, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: tag and component version
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "services/${{ matrix.service }}/kaval_${{ matrix.service }}/__init__.py")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/arm64
          tags: kaval/${{ matrix.service }}:release
          load: true # into the runner's Docker, so what is scanned is exactly what is pushed
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: image is arm64 and runs as the unprivileged user
        run: |
          image=kaval/${{ matrix.service }}:release
          test "$(docker image inspect -f '{{.Architecture}}' "$image")" = arm64
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001

      - name: install Trivy (checksum-verified)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz trivy && rm trivy.tgz
      - name: install cosign (checksum-verified)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-arm64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum --check --strict
          chmod +x cosign
      # A vulnerability found now, after merge, stops the publish: an image is only worth
      # promoting if it was clean when it was built.
      - name: Trivy scan
        run: |
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .github/trivy-ignore.yaml \
            --exit-code 1 --no-progress kaval/${{ matrix.service }}:release

      # The parts list (KAV-137, ADR-0089): every package inside the image that was just scanned,
      # as CycloneDX JSON. Made from the same local image the push below uploads, and before any
      # AWS access, so a failure here stops the release with nothing published.
      - name: parts list (SBOM) of the scanned image
        run: |
          mkdir -p sbom
          ./trivy image --format cyclonedx --no-progress --skip-version-check \
            --output "sbom/${{ matrix.service }}.cdx.json" kaval/${{ matrix.service }}:release
          python3 - "sbom/${{ matrix.service }}.cdx.json" <<'PY'
          import json, sys
          bom = json.load(open(sys.argv[1]))
          assert bom["bomFormat"] == "CycloneDX", bom.get("bomFormat")
          assert len(bom["components"]) >= 20, f"suspiciously short parts list: {len(bom['components'])}"
          print(f"{len(bom['components'])} parts listed")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom/${{ matrix.service }}.cdx.json
          if-no-files-found: error
          retention-days: 90

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A repository *secret*, not a variable and not a file in git: the ARN holds the account
          # number, and GitHub prints a variable in the step header of a public log but shows a
          # secret as ***. mask-aws-account-id hides the number from every later line of the job
          # (the registry address, the push and cosign lines). Not a credential either way: the
          # trust policy is what decides who may use the role (KAV-141, ADR-0091).
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: release-${{ matrix.service }}-${{ github.run_id }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ECR tags are immutable, so a second push of the same tag is an error rather than an
      # overwrite. A re-run for the same commit finds the image already there and reuses it.
      - name: push (or find) the image, and read its digest back from ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          repo="kaval/${{ matrix.service }}"
          if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "$repo:$TAG is already published; reusing it"
          else
            docker tag "kaval/${{ matrix.service }}:release" "$REGISTRY/$repo:$TAG"
            docker push "$REGISTRY/$repo:$TAG"
          fi
          digest=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p digests
          echo "${{ matrix.service }} $digest" > "digests/${{ matrix.service }}.txt"
          echo "- \`${{ matrix.service }}\` \`$TAG\` \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The signature (KAV-138, ADR-0090): a signed statement, kept in ECR beside the image, that
      # THIS digest was published by THIS workflow on main. Keyless: GitHub vouches for the run,
      # Sigstore notes it in a public log, and there is no key to keep or to leak. It is made for
      # the digest ECR reported, never a tag. If the digest already carries a valid signature from
      # this workflow (a re-run for a commit that is already published), nothing is added;
      # otherwise it is signed and then checked straight away, so "signed but unreadable" stops
      # the release instead of surfacing at promotion. The checks print nothing: their output
      # names the registry, and this log is public.
      - name: sign the image (keyless) unless it already carries a valid signature
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="$REGISTRY/kaval/${{ matrix.service }}@$DIGEST"
          check() {
            ./cosign verify "$ref" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" >/dev/null
          }
          if check 2>/dev/null; then
            echo "$DIGEST already carries a valid signature from this workflow; nothing to add"
          else
            ./cosign sign --yes "$ref"
            check
            echo "$DIGEST signed, and the signature checked"
          fi

      # The build record (KAV-137, ADR-0089): a signed statement, made with this run's own
      # identity (Sigstore, no key to keep), that THIS digest was built by THIS workflow from
      # THIS commit. It lives in GitHub's attestation store, not in ECR, so it needs no AWS
      # permission. The name has no registry host on purpose: the record is public, and the
      # host would put the AWS account number in it. Running again for a commit that is already
      # published just adds another record for the same digest.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: kaval/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}

      # The parts list (KAV-138): the CycloneDX list made above, now bound to the digest by the
      # same kind of signed statement, so "these are the parts of THIS image" can be proven later
      # and not only read from a workflow artifact that is deleted after 90 days. Kept in
      # GitHub's store, not in ECR, with the same host-free name as the build record.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: kaval/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom/${{ matrix.service }}.cdx.json

      # Ask GitHub's store for both records by the exact digest, so a record that was never
      # stored stops the release. This only proves the records EXIST; their signatures are
      # checked where the image can be read: by hand (docs/runbooks/verify-an-image.md) and, in
      # KAV-139, at the promotion gate. Retries because the store can lag the signing by seconds.
      - name: the build record and the parts list are in GitHub's store
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for kind in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
            found=0
            for attempt in 1 2 3 4 5; do
              n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/attestations/$DIGEST" -f predicate_type="$kind" \
                --jq '.attestations | length' 2>/dev/null || echo 0)
              if [ "$n" -ge 1 ]; then
                echo "$n record(s) of kind $kind stored for $DIGEST"
                found=1
                break
              fi
              echo "attempt $attempt: no $kind record stored yet; waiting"
              sleep 6
            done
            if [ "$found" -ne 1 ]; then
              echo "no $kind record is stored for $DIGEST" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.txt
          if-no-files-found: error

  propose:
    name: propose the staging pin (pull request)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writes a branch and a pull request. No id-token, so it cannot reach AWS.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the push below uses the workflow token
          fetch-depth: 0 # the existing tags, to know which versions are already named
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      # Name the versions these images carry (ADR-0013, ADR-0035): <svc>-vX.Y.Z for each component
      # and vX.Y.Z for the product, at this commit. Only a version with no tag yet is tagged, so a
      # release that did not bump anything tags nothing, and running this twice is harmless.
      - name: tag the versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release/versions.py tag --commit "$GITHUB_SHA" --push

      # Is this build a release? Only a tagged build can be promoted (promote.py, ADR-0081), and the
      # staging pull request says so, so nobody spends a staging session on one that cannot go on.
      - name: is this build a release
        id: release
        run: |
          version=$(python3 scripts/release/versions.py release-of --commit "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: point staging at the new tag
        id: pin
        run: |
          tag="sha-${GITHUB_SHA::7}"
          python3 scripts/release/pin_staging.py --tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "Staging already runs $tag; nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: open the pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="release/staging-${TAG#sha-}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; leaving it for a person to look at."
            exit 0
          fi
          {
            echo "Publishes \`$TAG\` (commit ${GITHUB_SHA}) and points staging at it."
            echo
            if [ -n "$VERSION" ]; then
              echo "**This build is release \`$VERSION\`.** It can be tested on staging and then promoted."
            else
              echo "**This build is NOT a release (no version tag).** It can run on staging but \`promote.yml\` will refuse it. To make a release: run \`release-prepare\` (Actions tab), merge its pull request, and use the build that makes (ADR-0081, \`docs/runbooks/release-a-version.md\`)."
            fi
            echo
            echo "| image | digest in ECR |"
            echo "|---|---|"
            sort digests/*.txt | while read -r svc digest; do echo "| \`kaval/$svc:$TAG\` | \`$digest\` |"; done
            echo
            echo "Built once by \`release.yml\` and scanned before the push; ECR tags are immutable, so the tag can never point at a different image. CI's first run on this pull request waits for a person to approve it (Actions tab, \`Approve and run\`). Merge when every check is green; staging's Flux pulls it the next time staging is up (\`make staging-up\`)."
            echo
            echo "Prod does not move. \`promote.yml\` (run by hand, ADR-0032) is the only way a digest reaches \`deploy/gitops/prod/\`."
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add deploy/gitops/staging/helmrelease.yaml deploy/environments/staging/values.yaml
          git commit -m "chore(release): point staging at $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): point staging at $TAG" --body-file body.md
          # CI starts on this pull request, but GitHub holds the first run of a bot's pull request
          # as "action_required" until a person approves it (Actions tab, "Approve and run", or
          # gh api -X POST repos/<owner>/<repo>/actions/runs/<id>/approve). That approval is the
          # human step before staging moves. A workflow_dispatch of ci.yml was tried instead and
          # did not satisfy the pull request's checks (Lab 32).

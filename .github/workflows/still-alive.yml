# The "still alive" cover for a PARKED production (KAV-83, ADR-0052).
#
# While production runs, its own poller pings an outside dead-man's-switch every couple of minutes,
# and the outside service raises the alarm when the pings stop. While production is parked nothing
# runs, so nothing would ping and the alarm would go off every parked day. This job fills exactly
# that gap: every five minutes it asks AWS whether the app-server group wants a server or has one,
# and ONLY when the answer is a clear "parked" does it send the ping. The rule is in
# scripts/ops/still_alive.py (tested): running, or not sure, sends nothing, so a dead production is
# never covered for.
#
# It runs from GitHub, not from inside AWS, on purpose: it must keep working when AWS is parked or
# broken. One job, one small power: its AWS role can only describe auto-scaling groups
# (infra/modules/still-alive); it cannot write to the repository or open issues. A red run means
# "could not decide, or could not ping"; a person is told by the outside service, not by this job.
#
# Off until two things exist: the repository variable AWS_STILL_ALIVE_ROLE_ARN (set after the role
# is applied, which is what switches this on) and the repository secret PROD_HEARTBEAT_URL (set with
# scripts/ops/set-heartbeat.sh). Every third-party action is pinned to a full commit SHA, as in ci.yml.
#
# Known limit: GitHub switches scheduled workflows off after 60 days without repository activity,
# and may delay a run by several minutes under load. Either makes a parked production look quiet to
# the outside service, which then says so: a false alarm, never a missed real one.

name: still-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: still-alive
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  cover:
    if: ${{ vars.AWS_STILL_ALIVE_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write   # to ask AWS for the one-hour read-only pass
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STILL_ALIVE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: still-alive-${{ github.run_id }}
      - name: ping for production only if it is clearly parked
        env:
          HEARTBEAT_URL: ${{ secrets.PROD_HEARTBEAT_URL }}
        run: python3 scripts/ops/still_alive.py kaval-prod

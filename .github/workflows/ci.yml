# CI: every pull request, and main after each merge (KAV-24, ADR-0010).
#
# Builds but never pushes. Publishing images, SBOMs and signatures is release.yml's job
# (Phase 4), because only a merged commit should ever produce an artifact.
#
# Supply-chain hygiene, because a CI job holds the repo's token:
#   - every third-party action is pinned to a full commit SHA (the tag is a comment).
#     A tag can be re-pointed; in March 2026 76 of trivy-action's 77 tags were, to
#     credential-stealing code (CVE-2026-33634). A SHA can't be.
#   - the gitleaks and Trivy binaries are downloaded directly and checked against
#     sha256 sums written in this file, so a replaced release asset fails the job.
#   - the token is read-only (`permissions` below), and no job reads a secret.
# Dependabot (.github/dependabot.yml) proposes the SHA bumps; the binaries' versions and
# sums are bumped by hand, together.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5" # Linux-ARM64
  TERRAFORM_VERSION: "1.11.4"
  OPA_VERSION: "1.21.0"
  OPA_SHA256: "5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9" # linux_amd64_static
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb" # linux-amd64
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883" # linux-amd64

jobs:
  lint:
    name: lint (ruff + mypy + commit messages)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the commit check below can see every commit the PR adds.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # --locked: fail if uv.lock no longer matches pyproject.toml, instead of quietly
      # resolving something new. The lockfile is the dependency set CI vouches for.
      - run: uv sync --locked --all-extras
      - run: uv run make lint
      # Every commit the PR adds follows the convention and carries its KAV key (KAV-25).
      # The local commit-msg hook checks the same rules; this catches a clone without it.
      # Values go through env, never straight into the script: a branch name is user input.
      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: uv run python scripts/dev/check_commits.py --range "$BASE_SHA..$HEAD_SHA" --branch "$HEAD_REF"

  test:
    name: test (pytest + migrations, real Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16 # the same image compose.yaml runs
        env:
          POSTGRES_DB: kaval
          POSTGRES_USER: kaval
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaval -d kaval"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kaval
      POSTGRES_USER: kaval
      POSTGRES_PASSWORD: ci-only-not-a-secret
      KAVAL_REQUIRE_DB: "1" # a database test that can't connect fails here, never skips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: install opa (checksum-verified) — KAV-42, joins this job per ADR-0010
        run: |
          curl -fsSLo opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum --check --strict
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: opa test policy/
        run: opa test policy/ -v
      - name: migrations apply from empty
        run: uv run alembic upgrade head
      - name: models and migrations agree (no drift)
        run: uv run alembic check
      - name: migrations reverse cleanly, then re-apply
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: pytest
        # KAVAL_REQUIRE_OPA=1: kaval_agent/tests/test_policy.py otherwise skips gracefully
        # when opa is missing (services/conftest.py's pattern for KAVAL_REQUIRE_DB) — here
        # opa is always installed above, so a skip would hide a real regression instead.
        env:
          KAVAL_REQUIRE_OPA: "1"
        run: uv run pytest services/ scripts/dev/ scripts/tracking/ evals/ -ra

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: the repo goes public at v1, so history must be clean
          persist-credentials: false
      - name: install gitleaks (checksum-verified)
        run: |
          curl -fsSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra
      # No AWS credentials here, deliberately: -backend=false plus validate checks the
      # configuration offline. Planning against the real account is a Phase 4 job with OIDC.
      - name: validate each environment
        run: |
          for env in infra/envs/*/; do
            ls "$env"*.tf >/dev/null 2>&1 || continue   # placeholder envs hold only .gitkeep
            echo "::group::$env"
            terraform -chdir="$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$env" validate
            echo "::endgroup::"
          done

  helm:
    name: helm (lint + render + schema validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install helm (checksum-verified)
        run: |
          curl -fsSLo helm.tgz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check --strict
          tar -xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - name: install kubeconform (checksum-verified)
        run: |
          curl -fsSLo kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check --strict
          tar -xzf kubeconform.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      # Every environment that has its own values.yaml today (only local exists; staging and
      # prod are Phase 4). Found live, not hypothetically (Lab 15): a {{- -}} trim pair ate the
      # newline between a template's top comment and its apiVersion: line, silently turning the
      # whole resource into a YAML comment — helm lint alone did not catch it; only rendering
      # and reading the output did. kubeconform is the automated version of that reading.
      - name: lint and render every environment's chart
        run: |
          for env in deploy/environments/*/; do
            values="${env}values.yaml"
            [ -f "$values" ] || continue   # placeholder envs hold only .gitkeep
            echo "::group::$env"
            helm lint deploy/charts/kaval -f "$values"
            helm template "kaval-$(basename "$env")" deploy/charts/kaval -f "$values" \
              | kubeconform -strict -kubernetes-version 1.35.5 -summary -
            echo "::endgroup::"
          done

  images:
    name: image ${{ matrix.service }} (arm64 build + Trivy)
    # Native Graviton-class runner: the image is built on the architecture it runs on
    # (CLAUDE.md constraint 2), with no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, collector, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The component's version is read from its code, never typed into the workflow (ADR-0013).
      - name: component version
        id: version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "services/${{ matrix.service }}/kaval_${{ matrix.service }}/__init__.py")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/arm64
          tags: kaval/${{ matrix.service }}:ci
          load: true # into the runner's Docker, for the checks below
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: image is arm64, runs as the unprivileged user, and its code imports
        run: |
          image=kaval/${{ matrix.service }}:ci
          test "$(docker image inspect -f '{{.Architecture}}' "$image")" = arm64
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          docker run --rm --entrypoint python "$image" \
            -c "import kaval_shared.models, kaval_${{ matrix.service }}, alembic; print('imports ok')"
      - name: agent image carries a working opa and the real policy bundle (KAV-42)
        if: matrix.service == 'agent'
        run: |
          image=kaval/agent:ci
          docker run --rm --entrypoint opa "$image" version
          docker run --rm --entrypoint python "$image" -c "
          from kaval_agent import policy
          from kaval_shared.models import BlastRadius
          assert policy.classify('delete_pvc', BlastRadius.pod, True, 0.99).value == 'never'
          print('policy bundle reachable from inside the image')
          "
      - name: image label carries the version the code inside it reports
        env:
          WANT: ${{ steps.version.outputs.version }}
        run: |
          image=kaval/${{ matrix.service }}:ci
          label=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")
          code=$(docker run --rm --entrypoint python "$image" -c "import kaval_${{ matrix.service }} as m; print(m.__version__)")
          echo "label=$label code=$code want=$WANT"
          test "$label" = "$WANT" && test "$code" = "$WANT"
      - name: install Trivy (checksum-verified)
        run: |
          curl -fsSLo trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz trivy && rm trivy.tgz
      # Fails on HIGH or CRITICAL vulnerabilities that have a fix available. Unfixed ones
      # are reported but can't be acted on until the base image publishes a patch.
      - name: Trivy scan
        run: |
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress kaval/${{ matrix.service }}:ci

# Rollback: put prod back on an earlier version (KAV-66, ADR-0034, the other half of ADR-0032).
#
#   you run it with a tag and a reason  ->  gate: has prod run it before (or did it pass staging),
#   is it older than prod, are its four images still in ECR, does going back cross a database
#   migration?  ->  propose: a pull request that points prod's two files at that tag  ->  CI runs on
#   it  ->  you merge.
#
# Merging that pull request is the go/no-go. Nothing here touches the cluster: prod is a Flux
# cluster that pulls what is on `main`, and this workflow has no credentials to reach it.
#
# A rollback is an emergency, so unlike promote.yml it never asks Jira. It needs only Git and a
# read-only look at ECR. The `promotion-guard` job in ci.yml accepts exactly the tags this gate
# accepts as known (on the record, or run by prod before), so the pull request is not blocked.
#
# The two jobs have different powers, as in promote.yml, and no job has both:
#   - `gate` can reach AWS (read-only: it describes four images) and cannot write to the repository.
#   - `propose` can write a branch and open a pull request, and has no AWS access.
#   - AWS accepts only a job from this repository running on `main` (infra/modules/ci-publish).
#   - Every third-party action is pinned to a full commit SHA, as in ci.yml.

name: rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Earlier tag to put prod back on, e.g. sha-ffb436b"
        required: true
        type: string
      reason:
        description: "Why, in a sentence (it goes in the pull request)"
        required: true
        type: string
      accept_migrations:
        description: "Go back even though it crosses a database migration (older code, newer database)"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: rollback
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  gate:
    name: gate (known tag, older, images in ECR, database)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # to ask GitHub for the OIDC token AWS checks
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: "has prod run it before" and "does it cross a migration" read it.
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The same role release.yml and promote.yml use. This job only describes images.
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: rollback-${{ github.run_id }}
      - name: verify
        shell: bash # pipefail, so a refusal still fails the job after tee
        env:
          # Workflow inputs are user input: they go through the environment, never into the script.
          TAG: ${{ inputs.tag }}
          ACCEPT: ${{ inputs.accept_migrations }}
        run: |
          mkdir -p evidence
          flags=()
          if [ "$ACCEPT" = "true" ]; then flags+=(--accept-migrations); fi
          python3 scripts/release/rollback.py verify --tag "$TAG" "${flags[@]}" | tee evidence/verify.txt
          { echo '```'; cat evidence/verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify
          path: evidence/verify.txt
          if-no-files-found: error

  propose:
    name: propose the rollback pin (pull request)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writes a branch and a pull request. No id-token, so it cannot reach AWS.
    permissions:
      contents: write
      pull-requests: write
      actions: read # to read this run's start time for the timing line below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the push below uses the workflow token
          fetch-depth: 0 # `pin` re-reads which tags prod has run before
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify
          path: evidence

      - name: point prod at the tag
        env:
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # `pin` checks the tag is known again on its own, so this job does not trust the one before.
          python3 scripts/release/rollback.py pin --tag "$TAG"
          if git diff --quiet; then
            echo "Prod already runs $TAG; nothing to propose."
            exit 0
          fi
          branch="rollback/prod-${TAG#sha-}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; leaving it for a person to look at."
            exit 0
          fi
          python3 scripts/release/rollback.py body --tag "$TAG" --reason "$REASON" \
            --evidence evidence/verify.txt > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add deploy/gitops/prod/helmrelease.yaml deploy/environments/prod/values.yaml
          git commit -m "fix(release): roll back prod to $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "fix(release): roll back prod to $TAG" --body-file body.md

          # The part of time-to-restore this workflow owns: pressing the button to a pull request
          # waiting for merge. ADR-0034 adds the cluster part, measured on staging.
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          secs=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Rollback pull request opened ${secs}s after the workflow was started." | tee -a "$GITHUB_STEP_SUMMARY"

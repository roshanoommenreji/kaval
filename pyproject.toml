[project]
name = "kaval"
version = "0.1.0"
description = "Autonomous ops agent with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.6",
    # The Vector column type (KAV-40). Core, not an extra: kaval_shared.models imports it,
    # and every image — gateway, collector, agent — imports kaval_shared.models.
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.53.0",
    "httpx>=0.27",
    # Slack ChatOps (KAV-55, ADR-0026): the outbound Socket Mode connection and chat.postMessage.
    # Pure stdlib-plus-websocket-client under the hood — no aiohttp needed, since this gateway
    # is sync SQLAlchemy throughout and the builtin Socket Mode client runs its own threads.
    "slack_sdk>=3.33",
]
agent = [
    # Calls Ollama for embeddings (KAV-40) and chat (KAV-41). Not installed in the agent's
    # own image: correlate.py has no network call, by ADR-0014 design. kaval_agent.context,
    # .index_runbooks and .diagnose are laptop-run tools for now (see Lab 10, Lab 11) and get
    # it from `uv sync --all-extras`, same as gateway's extra does for the gateway image.
    # diagnose.py itself has no git dependency, so — unlike recent_changes.py — nothing stops
    # it running inside the deployed agent image later; it stays laptop-only only because
    # nothing has decided how the deployed agent should be triggered yet (ADR-0016).
    "httpx>=0.27",
    # Bedrock escalation (KAV-44, ADR-0019): the Mantle client (anthropic.AnthropicBedrockMantle)
    # signs requests with SigV4 via boto3's own default credential chain (env vars, a named
    # profile, or an instance role — never a key committed anywhere), so boto3 is a real runtime
    # dependency here, not incidental. Laptop-only for the same reason httpx above is: nothing
    # decides how the deployed agent gets triggered yet (ADR-0016).
    "anthropic>=0.97",
    "boto3>=1.34",
]
executor = [
    # The only client the executor needs (KAV-47): it talks to the Kubernetes API, not to
    # AWS directly — cost actions (Phase 7) will add boto3 then, scoped the same way. Core,
    # not laptop-only like agent's httpx/boto3 above: kaval_executor.executor's entrypoint
    # loop calls it every pass, deployed or not.
    "kubernetes>=31.0",
]
collector = [
    # Real Kubernetes events (KAV-48): kaval_collector.k8s_events' entrypoint loop calls it
    # every pass, deployed or not — core, same reasoning as executor's own kubernetes extra.
    # kaval_collector.synthetic doesn't need it (no network call, pure fixture generation),
    # so this stays its own extra rather than merging into the always-installed core deps.
    "kubernetes>=31.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx2>=2.13",     # Starlette's TestClient (successor to httpx; Tom Christie, maintained by Pydantic)
]

[build-system]
requires = ["hatchling==1.32.4"]   # pinned: it builds our wheel inside every image (KAV-24)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "services/shared/kaval_shared",
    "services/gateway/kaval_gateway",
    "services/collector/kaval_collector",
    "services/agent/kaval_agent",
    "services/executor/kaval_executor",
]

[tool.alembic]
# Database migrations (was alembic.ini, moved here 2026-09-26, KAV-33). The database URL
# is not here: migrations/env.py builds it from the POSTGRES_* environment variables.
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own autogenerate output — machine-formatted, not hand-reflowed.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# No published type stubs (KAV-47). anthropic doesn't need this override: it's imported only
# from laptop-run tools (kaval_agent.escalate), never type-checked here the same way;
# kubernetes is a real runtime dependency of the deployed executor. boto3 joined on KAV-59:
# the staging idle-stop Lambda imports it, and that file is type-checked.
module = ["kubernetes.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services", "scripts/dev", "scripts/tracking", "evals", "infra/modules/idle-stop/lambda"]

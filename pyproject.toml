[project]
name = "kaval"
version = "0.1.0"
description = "Autonomous ops agent with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx2>=2.13",     # Starlette's TestClient (successor to httpx; Tom Christie, maintained by Pydantic)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "services/shared/kaval_shared",
    "services/gateway/kaval_gateway",
    "services/collector/kaval_collector",
]

[tool.alembic]
# Database migrations (was alembic.ini, moved here 2026-09-26, KAV-33). The database URL
# is not here: migrations/env.py builds it from the POSTGRES_* environment variables.
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own autogenerate output — machine-formatted, not hand-reflowed.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["services"]

# Configuration for scripts/dashboard.py
#
# Everything the dashboard cannot derive from the repository lives here.
# Status is NEVER recorded in this file — ROADMAP.md is the single source of
# truth for what is done. This holds links and figures only.

[project]
name        = "Kaval"
tagline     = "കാവൽ — the watch"
started     = "2026-08-22"
target_v1   = "2027-03-31"
phase_count = 10

[cost]
ceiling_usd        = 25
projected_total    = 47
budget_with_buffer = 70
mtd_usd            = 0.0        # updated from `make cost-report`; 0 while nothing is provisioned
provisioned        = false

# Run posture per phase — see docs/cost/budget-plan.md
[posture]
0 = { state = "local",      cost = "$0" }
1 = { state = "local",      cost = "$0" }
2 = { state = "local",      cost = "$0" }
3 = { state = "local",      cost = "$0" }
4 = { state = "paused",     cost = "~$2.20/mo" }
5 = { state = "paused",     cost = "~$2.20/mo" }
6 = { state = "paused",     cost = "~$2.20/mo" }
7 = { state = "always-on",  cost = "~$14/mo" }
8 = { state = "always-on",  cost = "~$14/mo + $4/lab" }
9 = { state = "always-on",  cost = "~$14/mo" }

